version: '3'
tasks:
  check:
    desc: Verify host prerequisites (podman >= 5.4, systemd, cgroup v2, swap off, sudo)
    cmds:
      - |
        set -e
        fail() { echo "preflight: $1" >&2; exit 1; }
        command -v podman >/dev/null || fail "podman not found (podman >= 5.4 is required)"
        v=$(podman --version | awk '{print $3}'); maj=${v%%.*}; min=${v#*.}; min=${min%%.*}
        [ "$maj" -gt 5 ] || { [ "$maj" -eq 5 ] && [ "$min" -ge 4 ]; } || fail "podman $v is too old (>= 5.4 required)"
        { [ -d /run/systemd/system ] || systemctl is-system-running >/dev/null 2>&1; } || fail "systemd is not running (tk8s v2 supports systemd hosts only)"
        [ "$(stat -fc %T /sys/fs/cgroup)" == "cgroup2fs" ] || fail "cgroup v2 is required"
        [ -z "$(swapon --show --noheadings 2>/dev/null)" ] || fail "swap is enabled; run: sudo swapoff -a and comment the swap line in /etc/fstab"
        sudo -n true 2>/dev/null || fail "sudo without a password prompt is required for podman and systemd operations"
        command -v curl >/dev/null || fail "curl not found"
        lsmod | grep -q br_netfilter || sudo modprobe br_netfilter || fail "cannot load br_netfilter"
        # kubeadm needs br_netfilter loaded, but with it the host's iptables FORWARD chain also sees
        # bridged frames between nodes. Docker sets that chain's policy to DROP, which silently kills
        # pod-to-node traffic (pod IPs match no netavark rule). Keep host-bridge frames out of the host
        # firewall; nodes set their own bridge-nf sysctls inside their network namespaces.
        sudo sysctl -qw net.bridge.bridge-nf-call-iptables=0 net.bridge.bridge-nf-call-ip6tables=0 || fail "cannot set net.bridge.bridge-nf-call-iptables"
        printf 'br_netfilter\n' | sudo tee /etc/modules-load.d/tk8s.conf >/dev/null
        printf '# tk8s: bridged frames between cluster nodes bypass the host firewall (Docker sets FORWARD DROP)\nnet.bridge.bridge-nf-call-iptables = 0\nnet.bridge.bridge-nf-call-ip6tables = 0\n' | sudo tee /etc/sysctl.d/90-tk8s.conf >/dev/null
        # Everything under TK_DATA_DIR belongs to the user running tkctl; only creating it under /opt
        # needs root. Nodes (root inside their containers) write into it regardless of ownership.
        # Only a root-owned directory (an earlier root-run tkctl) is taken over; another user's is refused.
        for d in {{ .TK_DATA_DIR }} {{ .CLUSTERS_DIR }} {{ .CNI_DIR }} {{ .TK_DATA_DIR }}/cache; do
          if [ ! -d "$d" ]; then sudo install -d -o "$(id -u)" -g "$(id -g)" "$d"
          elif [ ! -w "$d" ]; then
            if [ "$(stat -c %u "$d")" = 0 ]; then sudo chown "$(id -u):$(id -g)" "$d"
            else fail "$d is owned by $(stat -c %U "$d"), not $(id -un); set TK_DATA_DIR to a directory of your own or fix its ownership"; fi
          fi
        done
        echo "preflight ok: podman $v, systemd, cgroup v2, swap off, host bridge-nf off, {{ .TK_DATA_DIR }} owned by $(id -un)"
