version: '3'
# Day-2 operations on existing clusters.
tasks:
  _exists:
    internal: true
    requires: { vars: [NAME] }
    preconditions:
      - sh: 'test -f {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml'
        msg: "cluster {{ .NAME }} not found under {{ .CLUSTERS_DIR }} (tkctl get clusters)"

  list:
    desc: List clusters
    silent: true
    cmds:
      - |
        found=0
        for f in {{ .CLUSTERS_DIR }}/*/cluster.yaml; do
          [ -f "$f" ] || continue
          [ $found -eq 0 ] && printf '%-12s %-7s %-8s %-11s %-9s %-9s %s\n' NAME NODES K8S RUNTIME DATAPATH STATE SUBNET
          found=1
          d=$(dirname "$f"); n=$(basename "$d")
          k8s=$(grep -oE 'kubernetes: *"?[0-9.]+' "$f" | head -1 | tr -d '"' | awk '{print $2}')
          rt=$(grep -oE 'runtime: *[a-z]+' "$f" | head -1 | awk '{print $2}')
          dp=$(grep -oE 'datapath_resolved: *[a-z]+' "$f" | head -1 | awk '{print $2}'); [ -n "$dp" ] || dp=$(grep -oE 'datapath: *[a-z]+' "$f" | head -1 | awk '{print $2}')
          cp=$(grep -c 'role: control-plane' "$f"); wk=$(grep -c 'role: worker' "$f")
          sub=$(grep -oE 'nodes: *172\.[0-9.]+/24' "$f" | head -1 | awk '{print $2}')
          if [ ! -f "$d/.create-complete" ]; then st=Creating
          elif systemctl is-active --quiet "$n.target" 2>/dev/null; then st=Running; else st=Stopped; fi
          printf '%-12s %-7s %-8s %-11s %-9s %-9s %s\n' "$n" "${cp}+${wk}" "$k8s" "$rt" "$dp" "$st" "$sub"
        done
        [ $found -eq 1 ] || echo "no clusters"

  describe:
    desc: Describe a cluster (OUTPUT=yaml prints cluster.yaml)
    silent: true
    deps: [{ task: _exists, vars: { NAME: '{{ .NAME }}' } }]
    vars:
      F: '{{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml'
      RAW: { sh: 'cat {{ .F }} 2>/dev/null || printf "metadata: {name: %s}\nspec: {nodes: []}\n" {{ .NAME }}' }
      C: { ref: fromYaml .RAW }
      KUBECONFIG: '{{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig'
    cmds:
      - |
        {{ if eq .OUTPUT "yaml" }}cat {{ .F }}{{ else }}
        state=$( [ -f {{ .CLUSTERS_DIR }}/{{ .NAME }}/.create-complete ] && (systemctl is-active --quiet {{ .NAME }}.target && echo Running || echo Stopped) || echo Creating )
        echo "Name:        {{ .NAME }}"
        echo "State:       $state"
        echo "Kubernetes:  {{ .C.spec.kubernetes }}   runtime: {{ .C.spec.runtime }}   cni: {{ .C.spec.cni }}   datapath: {{ .C.spec.datapath_resolved | default .C.spec.datapath }}   gvisor: {{ .C.spec.gvisor }}"
        echo "Network:     nodes {{ .C.spec.network.nodes }} (gateway {{ .C.spec.network.gateway }})  pods {{ .C.spec.network.pods }}  services {{ .C.spec.network.services }}  lb {{ .C.spec.network.lb_range }}{{ if .C.spec.network.vip }}  vip {{ .C.spec.network.vip }}{{ end }}"
        echo "Nodes:"
        printf '  %-24s %-14s %-14s %-14s %s\n' NAME ROLE IP RESOURCES JOIN
        {{ range .C.spec.nodes }}
        j="{{ if eq (toString .join) "false" }}not joined{{ else }}joined{{ end }}"
        printf '  %-24s %-14s %-14s %-14s %s\n' "{{ .name }}" "{{ .role }}" "{{ .ip }}" "{{ .cpu }} cpu, {{ .memory }}" "$j"
        {{- end }}
        echo "Paths:"
        echo "  state:      {{ .CLUSTERS_DIR }}/{{ .NAME }}/"
        echo "  kubeconfig: {{ .KUBECONFIG }}"
        echo "  units:      /etc/containers/systemd/{{ .NAME }}/   target: /etc/systemd/system/{{ .NAME }}.target"
        {{ end }}

  stop:
    desc: Stop every node of a cluster (state and data are kept)
    silent: true
    deps: [{ task: _exists, vars: { NAME: '{{ .NAME }}' } }]
    cmds:
      - sudo systemctl stop {{ .NAME }}.target
      - echo "cluster {{ .NAME }} stopped"

  start:
    desc: Start a stopped cluster and wait for its nodes to be Ready
    silent: true
    deps: [{ task: _exists, vars: { NAME: '{{ .NAME }}' } }]
    cmds:
      - sudo systemctl start {{ .NAME }}.target
      - |
        export KUBECONFIG={{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig
        for i in $(seq 1 90); do
          total=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
          nr=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2!="Ready"' | wc -l)
          [ "$total" -gt 0 ] && [ "$nr" -eq 0 ] && break; sleep 5
        done
        kubectl get nodes --no-headers | awk '{print "  "$1, $2}'

  use:
    desc: Point ~/.kube/config at a cluster (the previous file is kept as ~/.kube/config.bak)
    silent: true
    deps: [{ task: _exists, vars: { NAME: '{{ .NAME }}' } }]
    cmds:
      - mkdir -p ~/.kube && { [ ! -f ~/.kube/config ] || cp ~/.kube/config ~/.kube/config.bak; }
      - install -m 600 {{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig ~/.kube/config
      - echo "~/.kube/config now points at {{ .NAME }}"

  delete:
    desc: 'Delete a cluster: units, containers, volumes, network, routes, state (asks for confirmation)'
    silent: true
    deps: [{ task: _exists, vars: { NAME: '{{ .NAME }}' } }]
    vars:
      F: '{{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml'
      RAW: { sh: 'cat {{ .F }} 2>/dev/null || printf "metadata: {name: %s}\nspec: {nodes: []}\n" {{ .NAME }}' }
      C: { ref: fromYaml .RAW }
    cmds:
      - |
        if [ "{{ .FORCE }}" != "1" ] && [ "${TKCTL_ASSUME_YES:-}" != "1" ]; then
          printf 'Delete cluster {{ .NAME }} including its PVC data under {{ .CLUSTERS_DIR }}/{{ .NAME }}/storage? [y/N] '
          read -r a || a=""
          case "$a" in y|Y) ;; *) echo "aborted"; exit 1 ;; esac
        fi
        errs=0
        step() { echo "  $1"; shift; "$@" >/dev/null 2>&1 || { echo "    failed: $*"; errs=$((errs+1)); }; }
        systemctl list-units --all --no-legend "{{ .NAME }}.target" | grep -q . && step "stop {{ .NAME }}.target" sudo systemctl disable --now {{ .NAME }}.target
        # The Quadlet network unit is a oneshot that stays active; stop it or a later cluster with the same name never creates its network.
        systemctl list-units --all --no-legend "{{ .NAME }}-network.service" | grep -q . && step "stop {{ .NAME }}-network.service" sudo systemctl stop {{ .NAME }}-network.service
        step "remove units" sudo rm -rf /etc/containers/systemd/{{ .NAME }} /etc/systemd/system/{{ .NAME }}.target
        step "daemon-reload" sudo systemctl daemon-reload
        sudo systemctl reset-failed "{{ .NAME }}*" 2>/dev/null || true
        {{ range .C.spec.nodes }}
        sudo podman container exists {{ .name }} 2>/dev/null && step "remove container {{ .name }}" sudo podman rm -f {{ .name }}
        for v in {{ .name }}-var {{ .name }}-etc {{ .name }}-usr-local-bin; do sudo podman volume exists $v 2>/dev/null && step "remove volume $v" sudo podman volume rm -f $v; done
        {{ end }}
        sudo podman network exists {{ .NAME }} 2>/dev/null && step "remove network {{ .NAME }}" sudo podman network rm -f {{ .NAME }}
        {{ if .C.spec.network }}
        ip route show {{ .C.spec.network.pods }} 2>/dev/null | grep -q . && step "remove route {{ .C.spec.network.pods }}" sudo ip route del {{ .C.spec.network.pods }}
        ip route show {{ .C.spec.network.services }} 2>/dev/null | grep -q . && step "remove route {{ .C.spec.network.services }}" sudo ip route del {{ .C.spec.network.services }}
        {{ end }}
        step "remove state {{ .CLUSTERS_DIR }}/{{ .NAME }}" sudo rm -rf {{ .CLUSTERS_DIR }}/{{ .NAME }}
        if [ $errs -eq 0 ]; then echo "cluster {{ .NAME }} deleted"; else echo "cluster {{ .NAME }} deleted with $errs failed step(s); see the lines above" >&2; exit 1; fi
