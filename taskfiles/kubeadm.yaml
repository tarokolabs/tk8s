version: '3'
# Bootstrap Kubernetes on the running nodes with kubeadm.
# render -> kube-vip (HA only) -> init (first control plane, --upload-certs)
#        -> join (remaining control planes with --control-plane, then workers)
tasks:
  render:
    desc: Render the kubeadm init configuration into the cluster state directory
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      K8S: '{{ .DEF.spec.kubernetes }}'
      CP_IP: '{{ (index .DEF.spec.nodes 0).ip }}'
      PODS: '{{ .DEF.spec.network.pods }}'
      SERVICES: '{{ .DEF.spec.network.services }}'
      VIP: '{{ .DEF.spec.network.vip | default "" }}'
      CRI_SOCKET: 'unix:///var/run/crio/crio.sock'
      OUT: '{{ if eq .DRY_RUN "true" }}/dev/stdout{{ else }}{{ .STATE_DIR }}/init-config.yaml{{ end }}'
    cmds:
      - |
        cat > {{ .OUT }} <<'KUBEADM'
        # Generated by tkctl for cluster {{ .CLUSTER }}.
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: InitConfiguration
        localAPIEndpoint:
          advertiseAddress: {{ .CP_IP }}
          bindPort: 6443
        nodeRegistration:
          criSocket: {{ .CRI_SOCKET }}
          imagePullPolicy: IfNotPresent
          name: {{ .CLUSTER }}-control-plane
          taints: null
        ---
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        clusterName: {{ .CLUSTER }}
        kubernetesVersion: {{ .K8S }}
        {{- if .VIP }}
        controlPlaneEndpoint: "{{ .VIP }}:6443"
        {{- end }}
        networking:
          dnsDomain: {{ .CLUSTER }}.k8s
          podSubnet: {{ .PODS }}
          serviceSubnet: {{ .SERVICES }}
        apiServer:
          extraArgs:
            - name: audit-log-format
              value: legacy
            - name: audit-policy-file
              value: /opt/taroko/logs/apiserver/audit-policy.yaml
            - name: audit-log-path
              value: /opt/taroko/logs/apiserver/audit.log
            - name: audit-log-maxage
              value: "3"
            - name: audit-log-maxbackup
              value: "5"
            - name: audit-log-maxsize
              value: "10"
          extraVolumes:
            - name: audit-logs
              hostPath: /opt/taroko
              mountPath: /opt/taroko
              readOnly: false
              pathType: DirectoryOrCreate
            - name: host-localtime
              hostPath: /etc/localtime
              mountPath: /etc/localtime
              readOnly: true
        ---
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        cgroupDriver: systemd
        evictionHard:
          memory.available: "500Mi"
          nodefs.available: "5%"
          imagefs.available: "5%"
        evictionSoft:
          memory.available: "500Mi"
          nodefs.available: "5%"
        evictionSoftGracePeriod:
          memory.available: "1m30s"
          nodefs.available: "1m30s"
        KUBEADM
      - |
        {{ if ne .DRY_RUN "true" }}
        # logs/ is created root-owned by nodes:up and written by the apiserver inside the node.
        sudo mkdir -p {{ .STATE_DIR }}/logs/apiserver
        sudo cp {{ .TK_HOME }}/manifests/audit-policy.yaml {{ .STATE_DIR }}/logs/apiserver/
        sudo chmod -R 777 {{ .STATE_DIR }}/logs
        {{ end }}

  kube-vip:
    desc: Place the kube-vip static pod on a control plane (NODE, default the first; multi-control-plane clusters only)
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      VIP: '{{ .DEF.spec.network.vip | default "" }}'
      TARGET_NODE: '{{ .NODE | default (print .CLUSTER "-control-plane") }}'
    status:
      - '[ -z "{{ .VIP }}" ] || sudo podman exec {{ .TARGET_NODE }} test -f /etc/kubernetes/manifests/kube-vip.yaml'
    cmds:
      - |
        [ -n "{{ .VIP }}" ] || exit 0
        # Every control plane runs kube-vip so the VIP fails over when one of them is down.
        # kubeadm >= 1.29: the init node must use super-admin.conf (admin.conf has no rights until
        # RBAC is bootstrapped); joined control planes only have admin.conf.
        kc=super-admin.conf; [ "{{ .TARGET_NODE }}" = "{{ .CLUSTER }}-control-plane" ] || kc=admin.conf
        sed -e 's/\$KUBEVIP/{{ .VIP }}/' -e 's#ghcr.io/kube-vip/kube-vip:v[0-9.]*#ghcr.io/kube-vip/kube-vip:{{ .VERSIONS.kube_vip }}#' -e "s#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/$kc#" {{ .TK_HOME }}/manifests/kube-vip.yaml \
          | sudo podman exec -i {{ .TARGET_NODE }} sh -c 'mkdir -p /etc/kubernetes/manifests && cat > /etc/kubernetes/manifests/kube-vip.yaml'
        echo "kube-vip {{ .VERSIONS.kube_vip }} static pod placed on {{ .TARGET_NODE }} (vip {{ .VIP }})"

  init:
    desc: kubeadm init on the first control plane; store kubeconfig and the certificate key
    silent: true
    requires: { vars: [CLUSTER] }
    deps:
      - { task: render, vars: { CLUSTER: '{{ .CLUSTER }}' } }
      - { task: kube-vip, vars: { CLUSTER: '{{ .CLUSTER }}' } }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      VIP: '{{ .DEF.spec.network.vip | default "" }}'
    status:
      - test -s {{ .STATE_DIR }}/kubeconfig
    cmds:
      - |
        set -e
        cp={{ .CLUSTER }}-control-plane
        if sudo podman exec $cp test -f /etc/kubernetes/admin.conf; then
          echo "$cp already initialized"
        else
          echo "kubeadm init on $cp ..."
          if ! out=$(sudo podman exec $cp kubeadm init --config=/opt/taroko/init-config.yaml --upload-certs --ignore-preflight-errors=SystemVerification 2>&1); then
            echo "$out" | tail -30 >&2; exit 1
          fi
          # kubeadm prints the certificate key only when controlPlaneEndpoint is set (multi-control-plane).
          key=$(echo "$out" | sed -nE 's/.*--certificate-key ([0-9a-f]+).*/\1/p' | head -1)
          if [ -n "$key" ]; then
            install -m 600 /dev/null {{ .STATE_DIR }}/.certificate-key && printf '%s\n' "$key" > {{ .STATE_DIR }}/.certificate-key
          elif [ -n "{{ .VIP }}" ]; then
            echo "certificate key not found in kubeadm output" >&2; exit 1
          fi
          echo "$cp initialized"
        fi
        # Write the kubeconfig 0600 through a temp file: a failed read must not leave an empty
        # file behind, or the status check above would skip init on the next run.
        install -m 600 /dev/null {{ .STATE_DIR }}/kubeconfig.tmp
        sudo podman exec $cp cat /etc/kubernetes/admin.conf > {{ .STATE_DIR }}/kubeconfig.tmp || {
          rm -f {{ .STATE_DIR }}/kubeconfig.tmp; echo "could not read /etc/kubernetes/admin.conf from $cp" >&2; exit 1; }
        mv {{ .STATE_DIR }}/kubeconfig.tmp {{ .STATE_DIR }}/kubeconfig

  join-plan:
    desc: Print how each node other than the first control plane is handled (join or skip)
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
    cmds:
      - |
        {{ range .DEF.spec.nodes }}{{ if ne .name (print $.CLUSTER "-control-plane") }}
        echo "{{ .name }} {{ .role }} {{ if eq (toString .join) "false" }}skip{{ else }}join{{ if and (eq .role "control-plane") $.DEF.spec.network.vip }} kube-vip{{ end }}{{ end }}"
        {{- end }}{{ end }}

  join:
    desc: 'Join the remaining control planes and all workers (nodes with join=false are left out)'
    silent: true
    requires: { vars: [CLUSTER] }
    deps: [{ task: init, vars: { CLUSTER: '{{ .CLUSTER }}' } }]
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      VIP: '{{ .DEF.spec.network.vip | default "" }}'
      HAS_CP_JOIN: '{{ $n := 0 }}{{ range .DEF.spec.nodes }}{{ if and (eq .role "control-plane") (ne .name (print $.CLUSTER "-control-plane")) (ne (toString .join) "false") }}{{ $n = add $n 1 }}{{ end }}{{ end }}{{ $n }}'
    env:
      KUBECONFIG: '{{ .STATE_DIR }}/kubeconfig'
    cmds:
      - |
        set -e
        join=$(sudo podman exec {{ .CLUSTER }}-control-plane kubeadm token create --print-join-command | tr -d '\r')
        key=$(cat {{ .STATE_DIR }}/.certificate-key 2>/dev/null || true)
        if [ "{{ .HAS_CP_JOIN }}" != "0" ] && [ -z "$key" ]; then
          # Certificate keys expire after two hours; upload a fresh one when none is stored.
          key=$(sudo podman exec {{ .CLUSTER }}-control-plane kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1)
          [ -n "$key" ] || { echo "could not obtain a certificate key from {{ .CLUSTER }}-control-plane" >&2; exit 1; }
          install -m 600 /dev/null {{ .STATE_DIR }}/.certificate-key && printf '%s\n' "$key" > {{ .STATE_DIR }}/.certificate-key
        fi
        {{ range .DEF.spec.nodes }}{{ if ne .name (print $.CLUSTER "-control-plane") }}
        {{ if eq (toString .join) "false" }}
        echo "{{ .name }} left unjoined (join: false); join later with: tkctl join node {{ $.CLUSTER }} {{ .name }}"
        {{ else }}
        if kubectl get node {{ .name }} >/dev/null 2>&1; then echo "{{ .name }} already joined"; else
          {{ if eq .role "control-plane" }}
          sudo podman exec {{ .name }} bash -c "$join --control-plane --certificate-key $key --apiserver-advertise-address {{ .ip }} --ignore-preflight-errors=SystemVerification" >/tmp/{{ .name }}.join 2>&1 || { tail -20 /tmp/{{ .name }}.join >&2; exit 1; }
          task --silent -d {{ $.TK_HOME }} kubeadm:kube-vip CLUSTER={{ $.CLUSTER }} NODE={{ .name }}
          {{ else }}
          sudo podman exec {{ .name }} bash -c "$join --ignore-preflight-errors=SystemVerification" >/tmp/{{ .name }}.join 2>&1 || { tail -20 /tmp/{{ .name }}.join >&2; exit 1; }
          {{ end }}
          echo "{{ .name }} joined ({{ .role }})"
        fi
        {{ end }}
        {{- end }}{{ end }}
        for n in {{ range .DEF.spec.nodes }}{{ if eq .role "control-plane" }}{{ .name }} {{ end }}{{ end }}; do
          kubectl taint node "$n" node-role.kubernetes.io/control-plane:NoSchedule- >/dev/null 2>&1 || true
        done

  bootstrap:
    desc: render -> kube-vip -> init -> join
    requires: { vars: [CLUSTER] }
    cmds:
      - task: join
        vars: { CLUSTER: '{{ .CLUSTER }}' }
