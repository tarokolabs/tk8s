version: '3'
# Bootstrap Kubernetes on the running nodes with kubeadm.
# render -> kube-vip (HA only) -> init (first control plane, --upload-certs)
#        -> join (remaining control planes with --control-plane, then workers)
tasks:
  render:
    desc: Render the kubeadm init configuration into the cluster state directory
    silent: true
    requires: { vars: [NAME] }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      K8S: '{{ .C.spec.kubernetes }}'
      CP_IP: '{{ (index .C.spec.nodes 0).ip }}'
      PODS: '{{ .C.spec.network.pods }}'
      SERVICES: '{{ .C.spec.network.services }}'
      VIP: '{{ .C.spec.network.vip | default "" }}'
      CRI_SOCKET: '{{ if eq .C.spec.runtime "crio" }}unix:///var/run/crio/crio.sock{{ else }}unix:///run/containerd/containerd.sock{{ end }}'
      OUT: '{{ if eq .DRY_RUN "1" }}/dev/stdout{{ else }}{{ .CLUSTERS_DIR }}/{{ .NAME }}/init-config.yaml{{ end }}'
    cmds:
      - |
        cat > {{ .OUT }} <<'KUBEADM'
        # Generated by tkctl for cluster {{ .NAME }}.
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: InitConfiguration
        localAPIEndpoint:
          advertiseAddress: {{ .CP_IP }}
          bindPort: 6443
        nodeRegistration:
          criSocket: {{ .CRI_SOCKET }}
          imagePullPolicy: IfNotPresent
          name: {{ .NAME }}-control-plane
          taints: null
        ---
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        clusterName: {{ .NAME }}
        kubernetesVersion: {{ .K8S }}
        {{- if .VIP }}
        controlPlaneEndpoint: "{{ .VIP }}:6443"
        {{- end }}
        networking:
          dnsDomain: {{ .NAME }}.k8s
          podSubnet: {{ .PODS }}
          serviceSubnet: {{ .SERVICES }}
        apiServer:
          extraArgs:
            - name: audit-log-format
              value: legacy
            - name: audit-policy-file
              value: /opt/taroko/logs/apiserver/audit-policy.yaml
            - name: audit-log-path
              value: /opt/taroko/logs/apiserver/audit.log
            - name: audit-log-maxage
              value: "3"
            - name: audit-log-maxbackup
              value: "5"
            - name: audit-log-maxsize
              value: "10"
          extraVolumes:
            - name: audit-logs
              hostPath: /opt/taroko
              mountPath: /opt/taroko
              readOnly: false
              pathType: DirectoryOrCreate
            - name: host-localtime
              hostPath: /etc/localtime
              mountPath: /etc/localtime
              readOnly: true
        ---
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        cgroupDriver: systemd
        evictionHard:
          memory.available: "500Mi"
          nodefs.available: "5%"
          imagefs.available: "5%"
        evictionSoft:
          memory.available: "500Mi"
          nodefs.available: "5%"
        evictionSoftGracePeriod:
          memory.available: "1m30s"
          nodefs.available: "1m30s"
        KUBEADM
      - |
        {{ if ne .DRY_RUN "1" }}
        # logs/ is created root-owned by nodes:up and written by the apiserver inside the node.
        sudo mkdir -p {{ .CLUSTERS_DIR }}/{{ .NAME }}/logs/apiserver
        sudo cp {{ .TK_HOME }}/manifests/audit-policy.yaml {{ .CLUSTERS_DIR }}/{{ .NAME }}/logs/apiserver/
        sudo chmod -R 777 {{ .CLUSTERS_DIR }}/{{ .NAME }}/logs
        {{ end }}

  kube-vip:
    desc: Place the kube-vip static pod on the first control plane (multi-control-plane clusters only)
    silent: true
    requires: { vars: [NAME] }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      VIP: '{{ .C.spec.network.vip | default "" }}'
    status:
      - '[ -z "{{ .VIP }}" ] || sudo podman exec {{ .NAME }}-control-plane test -f /etc/kubernetes/manifests/kube-vip.yaml'
    cmds:
      - |
        [ -n "{{ .VIP }}" ] || exit 0
        sed -e 's/\$KUBEVIP/{{ .VIP }}/' -e 's#ghcr.io/kube-vip/kube-vip:v[0-9.]*#ghcr.io/kube-vip/kube-vip:{{ .VERSIONS.kube_vip }}#' {{ .TK_HOME }}/manifests/kube-vip.yaml \
          | sudo podman exec -i {{ .NAME }}-control-plane sh -c 'mkdir -p /etc/kubernetes/manifests && cat > /etc/kubernetes/manifests/kube-vip.yaml'
        echo "kube-vip {{ .VERSIONS.kube_vip }} static pod placed (vip {{ .VIP }})"

  init:
    desc: kubeadm init on the first control plane; store kubeconfig and the certificate key
    silent: true
    requires: { vars: [NAME] }
    deps:
      - { task: render, vars: { NAME: '{{ .NAME }}' } }
      - { task: kube-vip, vars: { NAME: '{{ .NAME }}' } }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      VIP: '{{ .C.spec.network.vip | default "" }}'
    status:
      - test -f {{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig
    cmds:
      - |
        set -e
        cp={{ .NAME }}-control-plane
        if sudo podman exec $cp test -f /etc/kubernetes/admin.conf; then
          echo "$cp already initialized"
        else
          echo "kubeadm init on $cp ..."
          if ! out=$(sudo podman exec $cp kubeadm init --config=/opt/taroko/init-config.yaml --upload-certs --ignore-preflight-errors=SystemVerification 2>&1); then
            echo "$out" | tail -30 >&2; exit 1
          fi
          # kubeadm prints the certificate key only when controlPlaneEndpoint is set (multi-control-plane).
          key=$(echo "$out" | sed -nE 's/.*--certificate-key ([0-9a-f]+).*/\1/p' | head -1)
          if [ -n "$key" ]; then
            printf '%s\n' "$key" > {{ .CLUSTERS_DIR }}/{{ .NAME }}/.certificate-key && chmod 600 {{ .CLUSTERS_DIR }}/{{ .NAME }}/.certificate-key
          elif [ -n "{{ .VIP }}" ]; then
            echo "certificate key not found in kubeadm output" >&2; exit 1
          fi
          echo "$cp initialized"
        fi
        sudo podman cp $cp:/etc/kubernetes/admin.conf {{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig
        sudo chown "$(id -u):$(id -g)" {{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig
        chmod 600 {{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig

  join-plan:
    desc: Print how each node other than the first control plane is handled (join or skip)
    silent: true
    requires: { vars: [NAME] }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
    cmds:
      - |
        {{ range .C.spec.nodes }}{{ if ne .name (print $.NAME "-control-plane") }}
        echo "{{ .name }} {{ .role }} {{ if eq (toString .join) "false" }}skip{{ else }}join{{ end }}"
        {{- end }}{{ end }}

  join:
    desc: 'Join the remaining control planes and all workers (nodes with join=false are left out)'
    silent: true
    requires: { vars: [NAME] }
    deps: [{ task: init, vars: { NAME: '{{ .NAME }}' } }]
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
    env:
      KUBECONFIG: '{{ .CLUSTERS_DIR }}/{{ .NAME }}/kubeconfig'
    cmds:
      - |
        set -e
        join=$(sudo podman exec {{ .NAME }}-control-plane kubeadm token create --print-join-command | tr -d '\r')
        key=$(cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/.certificate-key 2>/dev/null || true)
        {{ range .C.spec.nodes }}{{ if ne .name (print $.NAME "-control-plane") }}
        {{ if eq (toString .join) "false" }}
        echo "{{ .name }} left unjoined (join: false); join later with: tkctl join node {{ $.NAME }} {{ .name }}"
        {{ else }}
        if kubectl get node {{ .name }} >/dev/null 2>&1; then echo "{{ .name }} already joined"; else
          {{ if eq .role "control-plane" }}
          sudo podman exec {{ .name }} bash -c "$join --control-plane --certificate-key $key --apiserver-advertise-address {{ .ip }} --ignore-preflight-errors=SystemVerification" >/tmp/{{ .name }}.join 2>&1 || { tail -20 /tmp/{{ .name }}.join >&2; exit 1; }
          {{ else }}
          sudo podman exec {{ .name }} bash -c "$join --ignore-preflight-errors=SystemVerification" >/tmp/{{ .name }}.join 2>&1 || { tail -20 /tmp/{{ .name }}.join >&2; exit 1; }
          {{ end }}
          echo "{{ .name }} joined ({{ .role }})"
        fi
        {{ end }}
        {{- end }}{{ end }}
        for n in {{ range .C.spec.nodes }}{{ if eq .role "control-plane" }}{{ .name }} {{ end }}{{ end }}; do
          kubectl taint node "$n" node-role.kubernetes.io/control-plane:NoSchedule- >/dev/null 2>&1 || true
        done

  bootstrap:
    desc: render -> kube-vip -> init -> join
    requires: { vars: [NAME] }
    cmds:
      - task: join
        vars: { NAME: '{{ .NAME }}' }
