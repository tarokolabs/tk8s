version: '3'
# CNI and Gateway API. cilium (default) provides kube-proxy replacement, LB-IPAM
# with L2 announcements, and the Gateway API controller. canal is kept as an
# alternative without Gateway API.
# The Gateway API CRDs, the cilium chart and the cilium CLI are pinned in versions.yaml; the CRDs and the chart are vendored under manifests/.
tasks:
  cli:
    desc: Install the cilium CLI into /usr/local/bin when it is missing (pinned in versions.yaml)
    silent: true
    status:
      - command -v cilium >/dev/null
    cmds:
      - |
        [ "${TK_OFFLINE:-}" != 1 ] || { echo "cilium CLI is not installed and TK_OFFLINE=1 forbids downloading it" >&2; exit 1; }
        curl -fsSL https://github.com/cilium/cilium-cli/releases/download/{{ .VERSIONS.cilium_cli }}/cilium-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin cilium
        echo "cilium CLI {{ .VERSIONS.cilium_cli }} installed to /usr/local/bin"

  install:
    desc: Install the CNI (cilium with Gateway API, or canal) and wait for nodes to be Ready
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      KUBECONFIG: '{{ .STATE_DIR }}/kubeconfig'
      CP_IP: '{{ (index .DEF.spec.nodes 0).ip }}'
      API_HOST: '{{ .DEF.spec.network.vip | default (index .DEF.spec.nodes 0).ip }}'
      DATAPATH:
        sh: |
          d="{{ .DEF.spec.datapath }}"
          if [ "$d" = auto ]; then
            maj=$(uname -r | cut -d. -f1); min=$(uname -r | cut -d. -f2 | cut -d- -f1)
            if [ "$maj" -gt 6 ] || { [ "$maj" -eq 6 ] && [ "$min" -ge 8 ]; }; then d=netkit; else d=veth; fi
          fi; echo $d
      LB_START: '{{ splitList "-" .DEF.spec.network.lb_range | first }}'
      LB_STOP: '{{ splitList "-" .DEF.spec.network.lb_range | last }}'
    env:
      KUBECONFIG: '{{ .KUBECONFIG }}'
    preconditions:
      - sh: 'test -f {{ .TK_HOME }}/manifests/gateway-api.{{ .VERSIONS.gateway_api | trimPrefix "v" }}.yaml'
        msg: "manifests/gateway-api.{{ .VERSIONS.gateway_api | trimPrefix \"v\" }}.yaml is missing; versions.yaml pins gateway_api {{ .VERSIONS.gateway_api }} but scripts/vendor-manifests.sh was not rerun"
      - sh: 'test -f {{ .TK_HOME }}/manifests/cilium-{{ .VERSIONS.cilium }}/Chart.yaml'
        msg: "manifests/cilium-{{ .VERSIONS.cilium }}/ is missing; versions.yaml pins cilium {{ .VERSIONS.cilium }} but scripts/vendor-manifests.sh was not rerun"
    status:
      # cilium counts as installed only once its LB-IPAM pool exists: a first attempt that timed
      # out waiting for the DaemonSet leaves the DaemonSet behind but never reached the pool.
      - '{ kubectl -n kube-system get ds cilium >/dev/null 2>&1 && kubectl get ciliumloadbalancerippool default-pool >/dev/null 2>&1; } || kubectl -n kube-system get ds canal >/dev/null 2>&1'
    cmds:
      - |
        set -e
        {{ if eq .DEF.spec.cni "cilium" }}
        task --silent -d {{ .TK_HOME }} cni:cli
        kubectl -n kube-system delete ds kube-proxy --ignore-not-found >/dev/null
        kubectl apply --server-side -f {{ .TK_HOME }}/manifests/gateway-api.{{ .VERSIONS.gateway_api | trimPrefix "v" }}.yaml >/dev/null
        echo "Gateway API {{ .VERSIONS.gateway_api }} CRDs installed (experimental channel)"
        echo "cilium datapath: {{ .DATAPATH }}{{ if eq .DATAPATH "netkit" }} (gVisor sandboxes have no network under netkit; use --datapath veth if you need gVisor){{ end }}"
        # A partially installed release (interrupted create) is upgraded in place instead of failing.
        action=install
        kubectl -n kube-system get secret -l owner=helm,name=cilium --no-headers 2>/dev/null | grep -q . && action=upgrade
        # The chart is vendored: cilium-cli would otherwise fetch any version it does not embed from helm.cilium.io.
        cilium $action --version {{ .VERSIONS.cilium }} --chart-directory {{ .TK_HOME }}/manifests/cilium-{{ .VERSIONS.cilium }} \
          --set bpf.datapathMode={{ .DATAPATH }} \
          --set cgroup.autoMount.enabled=false --set cgroup.hostRoot=/sys/fs/cgroup \
          --set securityContext.privileged=true \
          --set ipam.mode=kubernetes --set k8s.requireIPv4PodCIDR=true --set ipam.operator.clusterPoolIPv4MaskSize=24 \
          --set kubeProxyReplacement=true --set k8sServiceHost={{ .API_HOST }} --set k8sServicePort=6443 \
          --set l2announcements.enabled=true \
          --set routingMode=native --set autoDirectNodeRoutes=true --set ipv4NativeRoutingCIDR={{ .DEF.spec.network.pods }} \
          --set bpf.masquerade=true \
          --set bpf.lbExternalClusterIP=true \
          --set gatewayAPI.enabled=true --set gatewayAPI.externalTrafficPolicy=Local >/tmp/{{ .CLUSTER }}-cilium.out 2>&1
        # errexit ignores a failing left side of &&, so every wait fails explicitly.
        cilium status --wait --wait-duration 5m >/tmp/{{ .CLUSTER }}-cilium-status.out 2>&1 || {
          tail -20 /tmp/{{ .CLUSTER }}-cilium-status.out >&2
          echo "cilium did not become ready within 5 minutes (see /tmp/{{ .CLUSTER }}-cilium.out and cilium status)" >&2; exit 1; }
        echo "cilium {{ .VERSIONS.cilium }} ok ($action)"
        sed -e 's/${LBNET}.200/{{ .LB_START }}/' -e 's/${LBNET}.219/{{ .LB_STOP }}/' {{ .TK_HOME }}/manifests/cilium-lb.yaml | kubectl apply -f - >/dev/null
        echo "LB-IPAM pool {{ .DEF.spec.network.lb_range }}"
        kubectl wait gatewayclass cilium --for=condition=Accepted --timeout=120s >/dev/null || {
          echo "GatewayClass cilium was not accepted within 120 s (kubectl describe gatewayclass cilium)" >&2; exit 1; }
        echo "GatewayClass cilium accepted"
        f={{ .CLUSTER_YAML }}
        awk -v d="{{ .DATAPATH }}" '/^  datapath_resolved:/ {next} {print} /^  datapath: / {print "  datapath_resolved: " d}' $f > $f.tmp && mv $f.tmp $f
        {{ else }}
        kubectl get configmap kube-proxy -n kube-system -o yaml | sed 's/maxPerCore: null/maxPerCore: 0/' | kubectl apply -f - >/dev/null
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ .VERSIONS.calico }}/manifests/canal.yaml >/dev/null
        kubectl -n kube-system rollout status ds/canal --timeout=5m >/dev/null
        echo "canal ok (no Gateway API on this path)"
        {{ end }}
      - |
        set -e
        # Host routes to the pod and service subnets are the {{ .CLUSTER }}-routes.service unit,
        # started with the cluster target by nodes:up.
        for i in $(seq 1 60); do
          nr=$(kubectl get nodes --no-headers | awk '$2!="Ready"' | wc -l)
          if [ "$nr" -eq 0 ]; then break; fi
          if [ $i -eq 60 ]; then echo "nodes are not Ready after 5 minutes:" >&2; kubectl get nodes >&2; exit 1; fi
          sleep 5
        done
        kubectl get nodes --no-headers | awk '{print "  "$1, $2}'
