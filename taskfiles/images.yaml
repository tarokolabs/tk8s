version: '3'
# Shared read-only image store. The host pulls every image a cluster needs into one
# containers/storage graphroot per Kubernetes version (IMAGES_DIR/<version>, root-owned because
# rootful podman writes it); nodes mount it :ro as an additional image store, so a create pulls
# nothing. Only tkctl writes here. What a node pulls itself lands in its own /var volume.
tasks:
  node:
    desc: Pull the node image of a Kubernetes version, or build it locally when the tag is not published
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
      MINOR: '{{ regexReplaceAll "\\.[0-9]+$" .K8S "" }}'
      CRIO: '{{ if hasKey .VERSIONS.crio .MINOR }}{{ index .VERSIONS.crio .MINOR }}{{ end }}'
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node:v{{ .K8S }}'
    status:
      # REFRESH=1 (tkctl pull images --refresh): pull again even when the tag is present, so a
      # republished tag replaces the stale local image.
      - '{{ if eq .REFRESH "1" }}false{{ else }}sudo podman image exists {{ .IMAGE }}{{ end }}'
    cmds:
      - |
        [ "${TK_OFFLINE:-}" != 1 ] || { echo "node image {{ .IMAGE }} is not present and TK_OFFLINE=1 forbids pulling or building it" >&2; exit 1; }
        before=$(sudo podman image inspect --format '{{"{{"}}.Digest{{"}}"}}' {{ .IMAGE }} 2>/dev/null || true)
        if sudo podman pull {{ .IMAGE }} >/dev/null 2>&1; then
          after=$(sudo podman image inspect --format '{{"{{"}}.Digest{{"}}"}}' {{ .IMAGE }} 2>/dev/null || true)
          if [ -z "$before" ]; then echo "{{ .IMAGE }} pulled"
          elif [ "$before" = "$after" ]; then echo "{{ .IMAGE }} is up to date"
          else echo "{{ .IMAGE }} refreshed (the tag was republished)"; fi
        else
          [ -n "{{ .CRIO }}" ] || { echo "versions.yaml has no crio entry for Kubernetes minor {{ .MINOR }}; cannot build {{ .IMAGE }}" >&2; exit 1; }
          echo "{{ .IMAGE }} is not published; building locally (the first build takes a few minutes)"
          sudo podman build --build-arg VER={{ .K8S }} --build-arg CRIO={{ .CRIO }} --force-rm -t {{ .IMAGE }} {{ .TK_HOME }}/images/node
        fi

  init:
    desc: Create the store directories and the version's storage.conf when missing
    internal: true
    silent: true
    requires: { vars: [K8S] }
    cmds:
      # tkctl pull images may be the first command on a fresh host: build the whole user-owned data tree
      # the way preflight does (a root-owned dir is taken over, another user's refused).
      - task --silent -d {{ .TK_HOME }} preflight:data-dirs
      - sudo mkdir -p {{ .IMAGES_DIR }}/{{ .K8S }}
      - |
        [ -f {{ .IMAGES_DIR }}/{{ .K8S }}.conf ] || cat > {{ .IMAGES_DIR }}/{{ .K8S }}.conf <<'CONF'
        # Generated by tkctl: the shared image store for Kubernetes {{ .K8S }}. Used only through
        # CONTAINERS_STORAGE_CONF by images:ensure; nodes mount the graphroot read-only.
        [storage]
        driver = "overlay"
        graphroot = "{{ .IMAGES_DIR }}/{{ .K8S }}"
        runroot = "/run/taroko-images/{{ .K8S }}"

        [storage.options.overlay]
        mountopt = "nodev,metacopy=on"
        CONF

  status:
    desc: One line per image the version needs, "present" or "missing" in the store (used by list and ensure)
    silent: true
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
      CONF: '{{ .IMAGES_DIR }}/{{ .K8S }}.conf'
    deps:
      - { task: node, vars: { K8S: '{{ .K8S }}', REFRESH: '{{ .REFRESH }}' } }
    cmds:
      - task --silent -d {{ .TK_HOME }} cni:cli
      - |
        set -eo pipefail
        {{ .TK_HOME }}/scripts/images.sh {{ .K8S }} | while read -r img; do
          if [ -f {{ .CONF }} ] && [ -d {{ .IMAGES_DIR }}/{{ .K8S }} ] && sudo env CONTAINERS_STORAGE_CONF={{ .CONF }} podman image exists "$img"; then echo "present $img"; else echo "missing $img"; fi
        done

  list:
    desc: List the images a Kubernetes version needs and whether the shared store has them
    silent: true
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
    cmds:
      - |
        set -eo pipefail
        printf '%-8s %s\n' STATUS IMAGE
        task --silent -d {{ .TK_HOME }} images:status K8S={{ .K8S }} | awk '{printf "%-8s %s\n", $1, $2}'

  ensure:
    desc: 'Pull every image the version needs into the shared store (skips what is there; TK_OFFLINE=1: check only)'
    silent: true
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
    cmds:
      - task: init
        vars: { K8S: '{{ .K8S }}' }
      # One writer per version directory: a second ensure waits for the first, then finds everything present.
      - flock {{ .IMAGES_DIR }}/{{ .K8S }}.lock task --silent -d {{ .TK_HOME }} images:pull K8S={{ .K8S }} REFRESH={{ .REFRESH }}

  pull:
    desc: Pull the missing images of a version (ensure runs this under the lock)
    silent: true
    requires: { vars: [K8S] }
    vars:
      CONF: '{{ .IMAGES_DIR }}/{{ .K8S }}.conf'
    cmds:
      - |
        set -eo pipefail
        start=$(date +%s)
        status=$(task --silent -d {{ .TK_HOME }} images:status K8S={{ .K8S }} REFRESH={{ .REFRESH }})
        [ -n "$status" ] || { echo "images: scripts/images.sh listed no images for {{ .K8S }}" >&2; exit 1; }
        present=$(echo "$status" | grep -c '^present ' || true)
        missing=$(echo "$status" | awk '$1=="missing"{print $2}')
        if [ -z "$missing" ]; then echo "images {{ .K8S }}: $present present, nothing to pull ({{ .IMAGES_DIR }}/{{ .K8S }})"; exit 0; fi
        if [ "${TK_OFFLINE:-}" = 1 ]; then
          echo "TK_OFFLINE=1: $(echo "$missing" | wc -l | tr -d ' ') images are missing from {{ .IMAGES_DIR }}/{{ .K8S }}; run tkctl pull images --k8s {{ .K8S }} online:" >&2
          echo "$missing" | sed 's/^/  /' >&2; exit 1
        fi
        pulled=0
        for img in $missing; do
          # Registry CDNs hiccup (TLS resets, HTTP/2 errors); one retry covers that, a second failure is reported.
          if ! sudo env CONTAINERS_STORAGE_CONF={{ .CONF }} podman pull -q "$img" >/dev/null; then
            echo "  pull of $img failed; retrying in 5s"; sleep 5
            sudo env CONTAINERS_STORAGE_CONF={{ .CONF }} podman pull -q "$img" >/dev/null || { echo "images: pull of $img failed twice; rerun to resume" >&2; exit 1; }
          fi
          pulled=$((pulled+1)); echo "  pulled $img"
        done
        echo "images {{ .K8S }}: $present present, $pulled pulled in $(( $(date +%s) - start ))s ({{ .IMAGES_DIR }}/{{ .K8S }})"

  host:
    desc: Put the apiserver LB image into the host's store (copied from the shared store)
    silent: true
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
      CONF: '{{ .IMAGES_DIR }}/{{ .K8S }}.conf'
    cmds:
      - |
        set -eo pipefail
        for img in {{ .VERSIONS.haproxy }}; do
          sudo podman image exists "$img" && continue
          [ -f {{ .CONF }} ] && sudo env CONTAINERS_STORAGE_CONF={{ .CONF }} podman image exists "$img" || {
            echo "images: $img is not in the shared store {{ .IMAGES_DIR }}/{{ .K8S }}; run tkctl pull images --k8s {{ .K8S }}" >&2; exit 1; }
          sudo env CONTAINERS_STORAGE_CONF={{ .CONF }} podman save "$img" | sudo podman load >/dev/null
          echo "$img copied into the host store"
        done

  prune:
    desc: Delete the shared store of a Kubernetes version (refused while a cluster of that version exists)
    silent: true
    vars:
      K8S: '{{ .K8S | default .VERSIONS.kubernetes.default }}'
    preconditions:
      - sh: 'test -d {{ .IMAGES_DIR }}/{{ .K8S }} || test -f {{ .IMAGES_DIR }}/{{ .K8S }}.conf'
        msg: "no image store for Kubernetes {{ .K8S }} under {{ .IMAGES_DIR }} (tkctl get images)"
    cmds:
      - |
        if [ "${TK_ASSUME_YES:-}" != "1" ]; then
          printf 'Delete the shared image store for Kubernetes {{ .K8S }} under {{ .IMAGES_DIR }}? [y/N] '
          read -r a || a=""
          case "$a" in y|Y) ;; *) echo "aborted"; exit 1 ;; esac
        fi
      # The cluster check and the delete run under the version's lock, after the prompt: a create that
      # started while the prompt waited either holds the lock (prune waits, then sees its cluster) or
      # finds the store gone and refills it. The lock file stays so a waiting ensure keeps its inode.
      - flock {{ .IMAGES_DIR }}/{{ .K8S }}.lock task --silent -d {{ .TK_HOME }} images:delete-store K8S={{ .K8S }}

  delete-store:
    desc: Delete a version's store when no cluster uses it (prune runs this under the lock)
    silent: true
    requires: { vars: [K8S] }
    cmds:
      - |
        set -e
        using=""
        for f in {{ .CLUSTERS_DIR }}/*/cluster.yaml; do
          [ -f "$f" ] || continue
          if grep -qE '^ *kubernetes: *"?{{ .K8S }}"?' "$f"; then using="$using $(basename "$(dirname "$f")")"; fi
        done
        [ -z "$using" ] || { echo "image store {{ .K8S }} is used by cluster(s):$using; delete them first" >&2; exit 1; }
        sudo rm -rf {{ .IMAGES_DIR }}/{{ .K8S }}
        rm -f {{ .IMAGES_DIR }}/{{ .K8S }}.conf
        echo "image store {{ .K8S }} deleted"
