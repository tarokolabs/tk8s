version: '3'
# Node layer: Podman Quadlet units under /etc/containers/systemd/<name>/ plus a
# systemd target. Quadlet owns "nodes exist and run"; the kubeadm tasks own the
# cluster built on top of them.
vars:
  UNIT_DIR: /etc/containers/systemd
tasks:
  render:
    desc: Render Quadlet units and the cluster target from cluster.yaml
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      NODES: { ref: .DEF.spec.nodes }
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node:v{{ .DEF.spec.kubernetes }}'
      CP_NAME: '{{ .CLUSTER }}-control-plane'
      CP_IP: '{{ (index .DEF.spec.nodes 0).ip }}'
    cmds:
      - |
        {{ if eq .DRY_RUN "true" }}emit() { echo "# ---- $1"; cat; echo; }{{ else }}sudo mkdir -p {{ .UNIT_DIR }}/{{ .CLUSTER }}; emit() { sudo tee "$1" >/dev/null; }{{ end }}
        emit {{ .UNIT_DIR }}/{{ .CLUSTER }}/{{ .CLUSTER }}.network <<'UNIT'
        # Generated by tkctl for cluster {{ .CLUSTER }}. Edit cluster.yaml and re-run tkctl instead.
        [Network]
        NetworkName={{ .CLUSTER }}
        Subnet={{ .DEF.spec.network.nodes }}
        Gateway={{ .DEF.spec.network.gateway }}
        DNS=8.8.8.8
        DNS=168.95.1.1
        UNIT
        {{- range .NODES }}
        emit {{ $.UNIT_DIR }}/{{ $.CLUSTER }}/{{ .name }}.container <<'UNIT'
        # Generated by tkctl for cluster {{ $.CLUSTER }} ({{ .role }}). Edit cluster.yaml and re-run tkctl instead.
        [Unit]
        Description=tk8s node {{ .name }} ({{ .role }}) of cluster {{ $.CLUSTER }}
        PartOf={{ $.CLUSTER }}.target
        {{- if ne .name $.CP_NAME }}
        After={{ $.CP_NAME }}.service
        {{- end }}

        [Container]
        ContainerName={{ .name }}
        Image={{ $.IMAGE }}
        HostName={{ .name }}
        Network={{ $.CLUSTER }}.network
        IP={{ .ip }}
        Environment=TZ=Asia/Taipei
        Volume={{ $.CNI_DIR }}:/opt/cni/bin
        Volume=/lib/modules:/lib/modules:ro
        # Quadlet recreates the container on every start (--rm --replace). Everything the node
        # must keep across restarts and reboots lives in named volumes; podman copies the image
        # content into an empty volume on first use.
        Volume={{ .name }}-var:/var:suid,exec,dev,rbind
        Volume={{ .name }}-etc:/etc
        Volume={{ .name }}-usr-local-bin:/usr/local/bin
        Volume={{ $.STATE_DIR }}:/opt/taroko
        Volume={{ $.TK_WULIN_DIR }}:/opt/taroko/wulin
        StopTimeout=60
        PodmanArgs=--privileged --cgroupns=private --cpus {{ .cpu }} --memory {{ .memory }}

        [Service]
        # The node image stops with SIGRTMIN+3; systemd inside exits 130 on halt.
        SuccessExitStatus=130 143
        Restart=on-failure
        TimeoutStartSec=300

        [Install]
        WantedBy=multi-user.target
        UNIT
        {{- end }}
        emit /etc/systemd/system/{{ .CLUSTER }}.target <<'UNIT'
        # Generated by tkctl. Start or stop every node of cluster {{ .CLUSTER }} together.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }}
        Wants={{ range .NODES }}{{ .name }}.service {{ end }}{{ .CLUSTER }}-routes.service

        [Install]
        WantedBy=multi-user.target
        UNIT
        emit /etc/systemd/system/{{ .CLUSTER }}-routes.service <<'UNIT'
        # Generated by tkctl. Host routes to the pod and service subnets of cluster {{ .CLUSTER }}
        # through its first control plane; started with the target, so they survive a reboot.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }} host routes
        PartOf={{ .CLUSTER }}.target
        Wants={{ .CP_NAME }}.service
        After={{ .CP_NAME }}.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=ip route replace {{ .DEF.spec.network.pods }} via {{ .CP_IP }}
        ExecStart=ip route replace {{ .DEF.spec.network.services }} via {{ .CP_IP }}
        ExecStop=-ip route del {{ .DEF.spec.network.pods }} via {{ .CP_IP }}
        ExecStop=-ip route del {{ .DEF.spec.network.services }} via {{ .CP_IP }}
        UNIT

  image:
    desc: Pull the node image, or build it locally when the tag is not published
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node:v{{ .DEF.spec.kubernetes }}'
    status:
      - sudo podman image exists {{ .IMAGE }}
    cmds:
      - |
        if sudo podman pull {{ .IMAGE }} >/dev/null 2>&1; then echo "{{ .IMAGE }} pulled"; else
          echo "{{ .IMAGE }} is not published; building locally (the first build takes a few minutes)"
          sudo podman build --build-arg VER={{ .DEF.spec.kubernetes }} --force-rm -t {{ .IMAGE }} {{ .TK_HOME }}/images/node
        fi

  cni-plugins:
    desc: Install or refresh the CNI plugins in CNI_DIR (copied in place, never rm -r)
    cmds:
      - |
        set -e
        sudo mkdir -p {{ .CNI_DIR }}
        tmp=$(mktemp -d)
        curl -fsSL https://github.com/containernetworking/plugins/releases/download/{{ .VERSIONS.cni_plugins }}/cni-plugins-linux-amd64-{{ .VERSIONS.cni_plugins }}.tgz | tar -xz -C "$tmp"
        sudo cp -a "$tmp"/. {{ .CNI_DIR }}/
        rm -rf "$tmp"
        echo "CNI plugins $( {{ .CNI_DIR }}/bridge --version 2>/dev/null | head -1 ) in {{ .CNI_DIR }}"
    status:
      - test -x {{ .CNI_DIR }}/bridge

  up:
    desc: Install units, start the cluster target, wait for each node's systemd
    requires: { vars: [CLUSTER] }
    deps:
      - { task: image, vars: { CLUSTER: '{{ .CLUSTER }}' } }
      - cni-plugins
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      NODES: { ref: .DEF.spec.nodes }
    status:
      - systemctl is-active --quiet {{ .CLUSTER }}.target
      - '{{ range .NODES }}sudo podman exec {{ .name }} systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && {{ end }}true'
    cmds:
      - task: render
        vars: { CLUSTER: '{{ .CLUSTER }}' }
      - sudo mkdir -p {{ .STATE_DIR }}/storage {{ .STATE_DIR }}/logs {{ .TK_WULIN_DIR }}
      - |
        # A leftover <node>-var volume from an earlier cluster carries old kubelet/etcd
        # state and makes kubeadm preflight fail. Drop it when the node container is new.
        {{ range .NODES }}
        if ! sudo podman container exists {{ .name }} 2>/dev/null && [ ! -f {{ $.STATE_DIR }}/kubeconfig ]; then
          for v in {{ .name }}-var {{ .name }}-etc {{ .name }}-usr-local-bin; do
            if sudo podman volume exists $v 2>/dev/null; then sudo podman volume rm -f $v >/dev/null && echo "removed stale volume $v"; fi
          done
        fi
        {{ end }}
      - sudo systemctl daemon-reload
      - sudo systemctl reset-failed "{{ .CLUSTER }}*" 2>/dev/null || true
      - sudo systemctl enable --now --quiet {{ .CLUSTER }}.target
      - |
        # Wait for systemd inside each node, then for CRI-O: kubeadm preflight
        # fails if the CRI socket is not up yet (the first start also copies /etc into its volume).
        for n in {{ range .NODES }}{{ .name }} {{ end }}; do
          for i in $(seq 1 90); do
            s=$(sudo podman exec "$n" systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) break ;; esac
            [ $i -eq 90 ] && { echo "$n did not reach a running systemd state (journalctl -u $n)" >&2; exit 1; }
            sleep 2
          done
          for i in $(seq 1 60); do
            if sudo podman exec "$n" systemctl is-active --quiet crio 2>/dev/null; then echo "$n: systemd $s, crio active"; break; fi
            [ $i -eq 60 ] && { echo "$n: crio did not become active (podman exec $n journalctl -u crio)" >&2; exit 1; }
            sleep 2
          done
        done
