version: '3'
# Node layer: Podman Quadlet units under /etc/containers/systemd/<name>/ plus a
# systemd target. Quadlet owns "nodes exist and run"; the kubeadm tasks own the
# cluster built on top of them.
vars:
  UNIT_DIR: /etc/containers/systemd
tasks:
  render:
    desc: Render Quadlet units and the cluster target from cluster.yaml
    silent: true
    requires: { vars: [NAME] }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      NODES: { ref: .C.spec.nodes }
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node/{{ .C.spec.runtime }}:v{{ .C.spec.kubernetes }}'
      CP: '{{ .NAME }}-control-plane'
    cmds:
      - |
        {{ if eq .DRY_RUN "1" }}emit() { echo "# ---- $1"; cat; echo; }{{ else }}sudo mkdir -p {{ .UNIT_DIR }}/{{ .NAME }}; emit() { sudo tee "$1" >/dev/null; }{{ end }}
        emit {{ .UNIT_DIR }}/{{ .NAME }}/{{ .NAME }}.network <<'UNIT'
        # Generated by tkctl for cluster {{ .NAME }}. Edit cluster.yaml and re-run tkctl instead.
        [Network]
        NetworkName={{ .NAME }}
        Subnet={{ .C.spec.network.nodes }}
        Gateway={{ .C.spec.network.gateway }}
        DNS=8.8.8.8
        DNS=168.95.1.1
        UNIT
        {{- range .NODES }}
        emit {{ $.UNIT_DIR }}/{{ $.NAME }}/{{ .name }}.container <<'UNIT'
        # Generated by tkctl for cluster {{ $.NAME }} ({{ .role }}). Edit cluster.yaml and re-run tkctl instead.
        [Unit]
        Description=tk8s node {{ .name }} ({{ .role }}) of cluster {{ $.NAME }}
        PartOf={{ $.NAME }}.target
        {{- if ne .name $.CP }}
        After={{ $.CP }}.service
        {{- end }}

        [Container]
        ContainerName={{ .name }}
        Image={{ $.IMAGE }}
        HostName={{ .name }}
        Network={{ $.NAME }}.network
        IP={{ .ip }}
        Environment=TZ=Asia/Taipei
        Volume={{ $.CNI_DIR }}:/opt/cni/bin
        Volume=/lib/modules:/lib/modules:ro
        # Quadlet recreates the container on every start (--rm --replace). Everything the node
        # must keep across restarts and reboots lives in named volumes; podman copies the image
        # content into an empty volume on first use.
        Volume={{ .name }}-var:/var:suid,exec,dev,rbind
        Volume={{ .name }}-etc:/etc
        Volume={{ .name }}-usr-local-bin:/usr/local/bin
        Volume={{ $.CLUSTERS_DIR }}/{{ $.NAME }}:/opt/taroko
        Volume={{ $.WULIN_DIR }}:/opt/taroko/wulin
        StopTimeout=60
        PodmanArgs=--privileged --cgroupns=private --cpus {{ .cpu }} --memory {{ .memory }}

        [Service]
        # The node image stops with SIGRTMIN+3; systemd inside exits 130 on halt.
        SuccessExitStatus=130 143
        Restart=on-failure
        TimeoutStartSec=300

        [Install]
        WantedBy=multi-user.target
        UNIT
        {{- end }}
        emit /etc/systemd/system/{{ .NAME }}.target <<'UNIT'
        # Generated by tkctl. Start or stop every node of cluster {{ .NAME }} together.
        [Unit]
        Description=tk8s cluster {{ .NAME }}
        Wants={{ range $i, $n := .NODES }}{{ if $i }} {{ end }}{{ $n.name }}.service{{ end }}

        [Install]
        WantedBy=multi-user.target
        UNIT

  image:
    desc: Pull the node image, or build it locally when the tag is not published
    requires: { vars: [NAME] }
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node/{{ .C.spec.runtime }}:v{{ .C.spec.kubernetes }}'
    status:
      - sudo podman image exists {{ .IMAGE }}
    cmds:
      - |
        if sudo podman pull {{ .IMAGE }} >/dev/null 2>&1; then echo "{{ .IMAGE }} pulled"; else
          echo "{{ .IMAGE }} is not published; building locally (the first build takes a few minutes)"
          sudo podman build --build-arg VER={{ .C.spec.kubernetes }} --force-rm -t {{ .IMAGE }} {{ .TK_HOME }}/images/node/{{ .C.spec.runtime }}
        fi

  cni-plugins:
    desc: Install or refresh the CNI plugins in CNI_DIR (copied in place, never rm -r)
    cmds:
      - |
        set -e
        sudo mkdir -p {{ .CNI_DIR }}
        tmp=$(mktemp -d)
        url=$(curl -sL https://api.github.com/repos/containernetworking/plugins/releases/latest | grep -oE 'https://[^"]+linux-amd64[^"]+\.tgz' | head -1)
        curl -sL "$url" | tar -xz -C "$tmp"
        sudo cp -a "$tmp"/. {{ .CNI_DIR }}/ && rm -rf "$tmp"
        echo "CNI plugins $( {{ .CNI_DIR }}/bridge --version 2>/dev/null | head -1 ) in {{ .CNI_DIR }}"
    status:
      - test -x {{ .CNI_DIR }}/bridge

  up:
    desc: Install units, start the cluster target, wait for each node's systemd
    requires: { vars: [NAME] }
    deps:
      - { task: image, vars: { NAME: '{{ .NAME }}' } }
      - cni-plugins
    vars:
      RAW: { sh: 'cat {{ .CLUSTERS_DIR }}/{{ .NAME }}/cluster.yaml' }
      C: { ref: fromYaml .RAW }
      NODES: { ref: .C.spec.nodes }
    status:
      - systemctl is-active --quiet {{ .NAME }}.target
      - '{{ range .NODES }}sudo podman exec {{ .name }} systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && {{ end }}true'
    cmds:
      - task: render
        vars: { NAME: '{{ .NAME }}' }
      - sudo mkdir -p {{ .CLUSTERS_DIR }}/{{ .NAME }}/storage {{ .CLUSTERS_DIR }}/{{ .NAME }}/logs {{ .WULIN_DIR }}
      - |
        # A leftover <node>-var volume from an earlier cluster carries old kubelet/etcd
        # state and makes kubeadm preflight fail. Drop it when the node container is new.
        {{ range .NODES }}
        if ! sudo podman container exists {{ .name }} 2>/dev/null && [ ! -f {{ $.CLUSTERS_DIR }}/{{ $.NAME }}/kubeconfig ]; then
          for v in {{ .name }}-var {{ .name }}-etc {{ .name }}-usr-local-bin; do
            if sudo podman volume exists $v 2>/dev/null; then sudo podman volume rm -f $v >/dev/null && echo "removed stale volume $v"; fi
          done
        fi
        {{ end }}
      - sudo systemctl daemon-reload
      - sudo systemctl reset-failed "{{ .NAME }}*" 2>/dev/null || true
      - sudo systemctl enable --now --quiet {{ .NAME }}.target
      - |
        # Wait for systemd inside each node, then for the container runtime: kubeadm preflight
        # fails if the CRI socket is not up yet (the first start also copies /etc into its volume).
        cri={{ if eq .C.spec.runtime "crio" }}crio{{ else }}containerd{{ end }}
        for n in {{ range .NODES }}{{ .name }} {{ end }}; do
          for i in $(seq 1 90); do
            s=$(sudo podman exec "$n" systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) break ;; esac
            [ $i -eq 90 ] && { echo "$n did not reach a running systemd state (journalctl -u $n)" >&2; exit 1; }
            sleep 2
          done
          for i in $(seq 1 60); do
            if sudo podman exec "$n" systemctl is-active --quiet $cri 2>/dev/null; then echo "$n: systemd $s, $cri active"; break; fi
            [ $i -eq 60 ] && { echo "$n: $cri did not become active (podman exec $n journalctl -u $cri)" >&2; exit 1; }
            sleep 2
          done
        done
