version: '3'
# Node layer: Podman Quadlet units under /etc/containers/systemd/<name>/ plus a
# systemd target. Quadlet owns "nodes exist and run"; the kubeadm tasks own the
# cluster built on top of them.
vars:
  UNIT_DIR: /etc/containers/systemd
tasks:
  render:
    desc: Render Quadlet units and the cluster target from cluster.yaml
    silent: true
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      NODES: { ref: .DEF.spec.nodes }
      IMAGE: 'ghcr.io/tarokolabs/tk8s/node:v{{ .DEF.spec.kubernetes }}'
      CP_NAME: '{{ .CLUSTER }}-control-plane'
      CP_IP: '{{ (index .DEF.spec.nodes 0).ip }}'
      DNS_IP: '{{ .DEF.spec.network.dns }}'
      LB_IP: '{{ .DEF.spec.network.lb }}'
      DOMAIN: '{{ .CLUSTER }}.k8s'
      NOW: { sh: date +%s }
      SERIAL: '{{ if eq .DRY_RUN "true" }}1{{ else }}{{ .NOW }}{{ end }}'
    cmds:
      - |
        {{ if eq .DRY_RUN "true" }}emit() { echo "# ---- $1"; cat; echo; }; emit_state() { emit "$1"; }{{ else }}sudo mkdir -p {{ .UNIT_DIR }}/{{ .CLUSTER }}; emit() { sudo tee "$1" >/dev/null; }; mkdir -p {{ .STATE_DIR }}/dns {{ .STATE_DIR }}/lb {{ .STATE_DIR }}/nodes; emit_state() { cat > "$1"; }{{ end }}
        emit {{ .UNIT_DIR }}/{{ .CLUSTER }}/{{ .CLUSTER }}.network <<'UNIT'
        # Generated by tkctl for cluster {{ .CLUSTER }}. Edit cluster.yaml and re-run tkctl instead.
        [Network]
        NetworkName={{ .CLUSTER }}
        Subnet={{ .DEF.spec.network.nodes }}
        Gateway={{ .DEF.spec.network.gateway }}
        DNS=8.8.8.8
        DNS=168.95.1.1
        UNIT
        emit_state {{ .STATE_DIR }}/dns/Corefile <<'CONF'
        # Generated by tkctl for cluster {{ .CLUSTER }}: the zone with the apiserver SRV records; everything
        # else is forwarded to Podman's aardvark-dns at the gateway and from there to the host resolver.
        {{ .DOMAIN }}:53 {
            file /etc/coredns/db.{{ .DOMAIN }} {
                reload 10s
            }
            log
            errors
        }
        .:53 {
            forward . {{ .DEF.spec.network.gateway }}
            cache 30
            errors
        }
        CONF
        emit_state {{ .STATE_DIR }}/dns/db.{{ .DOMAIN }} <<'ZONE'
        ; Generated by tkctl for cluster {{ .CLUSTER }}. A new serial on every render makes CoreDNS reload it.
        $ORIGIN {{ .DOMAIN }}.
        $TTL 10
        @                    IN SOA   dns.{{ .DOMAIN }}. root.{{ .DOMAIN }}. ( {{ .SERIAL }} 10 10 60 10 )
        @                    IN NS    dns.{{ .DOMAIN }}.
        dns                  IN A     {{ .DNS_IP }}
        lb                   IN A     {{ .LB_IP }}
        api                  IN A     {{ .LB_IP }}
        {{- range .NODES }}
        {{ printf "%-20s" .name }} IN A     {{ .ip }}
        {{- end }}
        {{- range .NODES }}{{ if eq .role "control-plane" }}
        _apiserver._tcp      IN SRV   0 100 6443 {{ .name }}.{{ $.DOMAIN }}.
        {{- end }}{{ end }}
        ZONE
        emit_state {{ .STATE_DIR }}/lb/haproxy.cfg <<'CFG'
        # Generated by tkctl for cluster {{ .CLUSTER }}: the host-side apiserver load balancer at {{ .LB_IP }}.
        # TCP passthrough to every control plane found through the SRV record; health checks over TLS.
        global
            log stdout format raw local0
            stats socket /tmp/haproxy.sock mode 600 level admin

        defaults
            mode tcp
            log global
            option tcplog
            timeout connect 5s
            timeout client 10m
            timeout server 10m

        resolvers dns
            parse-resolv-conf
            resolve_retries 3
            timeout resolve 2s
            timeout retry 2s
            hold valid 10s
            hold obsolete 120s
            hold nx 120s
            hold refused 120s
            hold timeout 120s
            hold other 120s

        frontend apiserver
            bind *:6443
            default_backend control-planes

        frontend stats
            mode http
            bind 127.0.0.1:8404
            stats enable
            stats uri /stats

        backend control-planes
            balance roundrobin
            option httpchk GET /readyz
            http-check expect status 200
            default-server check inter 2s fall 3 rise 2 check-ssl verify none init-addr none resolvers dns resolve-prefer ipv4
            server-template cp 5 _apiserver._tcp.{{ .DOMAIN }}
        CFG
        {{- range .NODES }}{{ if eq .role "worker" }}
        emit_state {{ $.STATE_DIR }}/nodes/{{ .name }}.env <<'ENV'
        TK_CLUSTER_DOMAIN={{ $.DOMAIN }}
        ENV
        {{- end }}{{ end }}
        emit {{ .UNIT_DIR }}/{{ .CLUSTER }}/{{ .CLUSTER }}-dns.container <<'UNIT'
        # Generated by tkctl for cluster {{ .CLUSTER }}. Edit cluster.yaml and re-run tkctl instead.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }} DNS (CoreDNS: apiserver SRV records)
        PartOf={{ .CLUSTER }}.target

        [Container]
        ContainerName={{ .CLUSTER }}-dns
        Image={{ .VERSIONS.coredns }}
        Network={{ .CLUSTER }}.network
        IP={{ .DNS_IP }}
        Volume={{ .STATE_DIR }}/dns:/etc/coredns:ro
        Exec=-conf /etc/coredns/Corefile

        [Service]
        Restart=always

        [Install]
        WantedBy={{ .CLUSTER }}.target
        UNIT
        emit {{ .UNIT_DIR }}/{{ .CLUSTER }}/{{ .CLUSTER }}-lb.container <<'UNIT'
        # Generated by tkctl for cluster {{ .CLUSTER }}. Edit cluster.yaml and re-run tkctl instead.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }} apiserver load balancer (HAProxy at {{ .LB_IP }})
        PartOf={{ .CLUSTER }}.target
        After={{ .CLUSTER }}-dns.service

        [Container]
        ContainerName={{ .CLUSTER }}-lb
        Image={{ .VERSIONS.haproxy }}
        Network={{ .CLUSTER }}.network
        IP={{ .LB_IP }}
        DNS={{ .DNS_IP }}
        Volume={{ .STATE_DIR }}/lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

        [Service]
        Restart=always

        [Install]
        WantedBy={{ .CLUSTER }}.target
        UNIT
        {{- range .NODES }}
        emit {{ $.UNIT_DIR }}/{{ $.CLUSTER }}/{{ .name }}.container <<'UNIT'
        # Generated by tkctl for cluster {{ $.CLUSTER }} ({{ .role }}). Edit cluster.yaml and re-run tkctl instead.
        [Unit]
        Description=tk8s node {{ .name }} ({{ .role }}) of cluster {{ $.CLUSTER }}
        PartOf={{ $.CLUSTER }}.target
        After={{ $.CLUSTER }}-dns.service
        {{- if ne .name $.CP_NAME }}
        After={{ $.CP_NAME }}.service
        {{- end }}

        [Container]
        ContainerName={{ .name }}
        Image={{ $.IMAGE }}
        HostName={{ .name }}
        Network={{ $.CLUSTER }}.network
        IP={{ .ip }}
        Environment=TZ=Asia/Taipei
        # The cluster DNS (apiserver SRV records) is this container's upstream resolver; api.<cluster>.k8s
        # is the controlPlaneEndpoint: a worker reaches it through its own HAProxy on 127.0.0.1, a control
        # plane through the host-side LB (its own apiserver is not up yet when it joins).
        DNS={{ $.DNS_IP }}
        AddHost=api.{{ $.DOMAIN }}:{{ if eq .role "worker" }}127.0.0.1{{ else }}{{ $.LB_IP }}{{ end }}
        {{- if eq .role "worker" }}
        Volume={{ $.STATE_DIR }}/nodes/{{ .name }}.env:/etc/tk8s/apiserver-lb.env:ro
        {{- end }}
        Volume={{ $.CNI_DIR }}:/opt/cni/bin
        Volume=/lib/modules:/lib/modules:ro
        # Quadlet recreates the container on every start (--rm --replace). Everything the node
        # must keep across restarts and reboots lives in named volumes; podman copies the image
        # content into an empty volume on first use.
        Volume={{ .name }}-var:/var:suid,exec,dev,rbind
        Volume={{ .name }}-etc:/etc
        Volume={{ .name }}-usr-local-bin:/usr/local/bin
        # The host's shared image store for this Kubernetes version (images:ensure fills it). CRI-O
        # reads it as an additional image store, so nothing a create needs is pulled; read-only
        # because one writer per store is the rule. Podman mounts it after the /var volume (deeper path).
        Volume={{ $.IMAGES_DIR }}/{{ $.DEF.spec.kubernetes }}:/var/lib/containers/shared:ro
        Volume={{ $.STATE_DIR }}:/opt/taroko
        Volume={{ $.TK_WULIN_DIR }}:/opt/taroko/wulin
        StopTimeout=60
        PodmanArgs=--privileged --cgroupns=private --cpus {{ .cpu }} --memory {{ .memory }}

        [Service]
        # The node image stops with SIGRTMIN+3; systemd inside exits 130 on halt.
        SuccessExitStatus=130 143
        Restart=on-failure
        TimeoutStartSec=300

        [Install]
        WantedBy=multi-user.target
        UNIT
        {{- end }}
        emit /etc/systemd/system/{{ .CLUSTER }}.target <<'UNIT'
        # Generated by tkctl. Start or stop every node of cluster {{ .CLUSTER }} together.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }}
        Wants={{ .CLUSTER }}-dns.service {{ .CLUSTER }}-lb.service {{ range .NODES }}{{ .name }}.service {{ end }}{{ .CLUSTER }}-routes.service

        [Install]
        WantedBy=multi-user.target
        UNIT
        emit /etc/systemd/system/{{ .CLUSTER }}-routes.service <<'UNIT'
        # Generated by tkctl. Host routes to the pod and service subnets of cluster {{ .CLUSTER }}
        # through its first control plane; started with the target, so they survive a reboot.
        [Unit]
        Description=tk8s cluster {{ .CLUSTER }} host routes
        PartOf={{ .CLUSTER }}.target
        Wants={{ .CP_NAME }}.service
        After={{ .CP_NAME }}.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=ip route replace {{ .DEF.spec.network.pods }} via {{ .CP_IP }}
        ExecStart=ip route replace {{ .DEF.spec.network.services }} via {{ .CP_IP }}
        ExecStop=-ip route del {{ .DEF.spec.network.pods }} via {{ .CP_IP }}
        ExecStop=-ip route del {{ .DEF.spec.network.services }} via {{ .CP_IP }}
        UNIT

  image:
    desc: Pull or build the node image of the cluster's Kubernetes version (images:node)
    requires: { vars: [CLUSTER] }
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
    cmds:
      - task --silent -d {{ .TK_HOME }} images:node K8S={{ .DEF.spec.kubernetes }}

  cni-plugins:
    desc: Install or refresh the CNI plugins in CNI_DIR (copied in place, never rm -r)
    cmds:
      - |
        set -e
        [ "${TK_OFFLINE:-}" != 1 ] || { echo "CNI plugins are not installed in {{ .CNI_DIR }} and TK_OFFLINE=1 forbids downloading them" >&2; exit 1; }
        mkdir -p {{ .CNI_DIR }}
        # Plugins installed by an earlier root-run tkctl are root-owned; take them over once.
        if [ -e {{ .CNI_DIR }}/bridge ] && [ ! -w {{ .CNI_DIR }}/bridge ] && [ "$(stat -c %u {{ .CNI_DIR }}/bridge)" = 0 ]; then sudo chown -R "$(id -u):$(id -g)" {{ .CNI_DIR }}; fi
        tmp=$(mktemp -d)
        curl -fsSL https://github.com/containernetworking/plugins/releases/download/{{ .VERSIONS.cni_plugins }}/cni-plugins-linux-amd64-{{ .VERSIONS.cni_plugins }}.tgz | tar -xz -C "$tmp"
        cp -a "$tmp"/. {{ .CNI_DIR }}/
        rm -rf "$tmp"
        echo "CNI plugins $( {{ .CNI_DIR }}/bridge --version 2>/dev/null | head -1 ) in {{ .CNI_DIR }}"
    status:
      - test -x {{ .CNI_DIR }}/bridge

  up:
    desc: Install units, start the cluster target, wait for each node's systemd
    requires: { vars: [CLUSTER] }
    deps:
      - { task: image, vars: { CLUSTER: '{{ .CLUSTER }}' } }
      - cni-plugins
    vars:
      STATE_DIR: '{{ .CLUSTERS_DIR }}/{{ .CLUSTER }}'
      CLUSTER_YAML: '{{ .STATE_DIR }}/cluster.yaml'
      DEF_RAW: { sh: 'cat {{ .CLUSTER_YAML }}' }
      DEF: { ref: fromYaml .DEF_RAW }
      NODES: { ref: .DEF.spec.nodes }
    status:
      - systemctl is-active --quiet {{ .CLUSTER }}.target
      - '{{ range .NODES }}sudo podman exec {{ .name }} systemctl is-system-running 2>/dev/null | grep -qE "running|degraded" && {{ end }}true'
    cmds:
      - task: render
        vars: { CLUSTER: '{{ .CLUSTER }}' }
      - task --silent -d {{ .TK_HOME }} images:host K8S={{ .DEF.spec.kubernetes }}
      - mkdir -p {{ .STATE_DIR }}/storage {{ .STATE_DIR }}/logs
      - '[ -d {{ .TK_WULIN_DIR }} ] || sudo install -d -o "$(id -u)" -g "$(id -g)" {{ .TK_WULIN_DIR }}'
      - |
        # A leftover <node>-var volume from an earlier cluster carries old kubelet/etcd
        # state and makes kubeadm preflight fail. Drop it when the node container is new.
        {{ range .NODES }}
        if ! sudo podman container exists {{ .name }} 2>/dev/null && [ ! -f {{ $.STATE_DIR }}/kubeconfig ]; then
          for v in {{ .name }}-var {{ .name }}-etc {{ .name }}-usr-local-bin; do
            if sudo podman volume exists $v 2>/dev/null; then sudo podman volume rm -f $v >/dev/null && echo "removed stale volume $v"; fi
          done
        fi
        {{ end }}
      - sudo systemctl daemon-reload
      - sudo systemctl reset-failed "{{ .CLUSTER }}*" 2>/dev/null || true
      - sudo systemctl enable --now --quiet {{ .CLUSTER }}.target
      - |
        # Wait for systemd inside each node, then for CRI-O: kubeadm preflight
        # fails if the CRI socket is not up yet (the first start also copies /etc into its volume).
        for n in {{ range .NODES }}{{ .name }} {{ end }}; do
          for i in $(seq 1 90); do
            s=$(sudo podman exec "$n" systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) break ;; esac
            [ $i -eq 90 ] && { echo "$n did not reach a running systemd state (journalctl -u $n)" >&2; exit 1; }
            sleep 2
          done
          for i in $(seq 1 60); do
            if sudo podman exec "$n" systemctl is-active --quiet crio 2>/dev/null; then echo "$n: systemd $s, crio active"; break; fi
            [ $i -eq 60 ] && { echo "$n: crio did not become active (podman exec $n journalctl -u crio)" >&2; exit 1; }
            sleep 2
          done
        done
        # The LB resolving every control plane through the SRV record proves the DNS serves the zone and
        # the LB config is good; the backends stay DOWN until kubeadm brings an apiserver up.
        want={{ $n := 0 }}{{ range .NODES }}{{ if eq .role "control-plane" }}{{ $n = add $n 1 }}{{ end }}{{ end }}{{ $n }}
        for i in $(seq 1 30); do
          got=$(sudo podman exec {{ .CLUSTER }}-lb bash -c 'exec 3<>/dev/tcp/127.0.0.1/8404; printf "GET /stats;csv HTTP/1.0\r\n\r\n" >&3; cat <&3' 2>/dev/null | grep '^control-planes,cp' | grep -vc 'MAINT (resolution)' || true)
          [ "${got:-0}" -ge "$want" ] && { echo "{{ .CLUSTER }}-lb: $got control plane(s) resolved through {{ .DEF.spec.network.dns }}"; break; }
          [ $i -eq 30 ] && { echo "{{ .CLUSTER }}-lb resolved ${got:-0} of $want control planes within 60 s (podman logs {{ .CLUSTER }}-dns; podman logs {{ .CLUSTER }}-lb)" >&2; exit 1; }
          sleep 2
        done
