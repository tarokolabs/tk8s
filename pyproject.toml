[project]
name = "tk8s"
version = "0.0.0"
description = "Kubernetes clusters as Podman Quadlet containers on one host, for teaching"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6", "pydantic>=2.12"]

[project.scripts]
tkctl = "tk8s.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.19", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
