name: ci
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [python, main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: sudo apt-get install -y shellcheck >/dev/null && shellcheck -S warning scripts/*.sh && shellcheck -s sh -S warning install.sh
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' versions.yaml .github/workflows
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"  # the same uv as versions.yaml (tests/test_workflows.py keeps them equal)
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest -q
