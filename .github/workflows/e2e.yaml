# e2e: a real cluster on a GitHub runner for each supported Kubernetes version, on every push to main
# and tag. Ubuntu 24.04 runners ship podman 4.9, below the 5.4 floor, and OBS has no podman 5 for Ubuntu,
# so podman is built from source; the node and router images are built from this checkout so e2e verifies
# the recipes being released, not whatever GHCR holds.
# The create runs offline: the shared image store is filled first, every download host is blocked in
# /etc/hosts, and the CRI-O journal of each node must show no pull.
name: e2e
# Least privilege: the job only reads the checkout; the cluster lives on the runner.
permissions:
  contents: read
on:
  push:
    branches: [v2, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      datapath:
        description: "cilium datapath: auto | netkit | veth"
        required: false
        default: auto
        type: string
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      k8s: ${{ steps.v.outputs.k8s }}
      default: ${{ steps.v.outputs.default }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          d=$(sed -nE 's/^  default: *"([^"]+)"/\1/p' versions.yaml); p=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml)
          echo "k8s=[\"$d\",\"$p\"]" >> "$GITHUB_OUTPUT"
          echo "default=$d" >> "$GITHUB_OUTPUT"
  cluster:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.versions.outputs.k8s) }}
        ha: [proxy]
        # bgp once, on the default version: the router and FRR do not care which Kubernetes
        include:
          - k8s: ${{ needs.versions.outputs.default }}
            ha: bgp
          # two routers once, bgp: VRRP floats .253, one router down, add node, back
          - k8s: ${{ needs.versions.outputs.default }}
            ha: bgp
            routers: 2
          # Cluster Mesh once, on the default/proxy entry: a second cluster on the previous
          # Kubernetes, connect, a global service across both, disconnect, delete
          - k8s: ${{ needs.versions.outputs.default }}
            ha: proxy
            mesh: true
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the runner (podman 5 built from source, helpers from OBS, swap off, sudo)
        run: |
          set -eux
          # Ubuntu 24.04 ships podman 4.9 and OBS has no podman 5 for it, only the helpers.
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/libcontainers-unstable.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/libcontainers-unstable.gpg] https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_24.04/ /" \
            | sudo tee /etc/apt/sources.list.d/libcontainers-unstable.list
          sudo apt-get update -qq
          # Keep containers-common (policy.json, registries.conf); drop the 4.9 binary and its Quadlet generator.
          sudo apt-get remove -y -qq podman crun
          sudo apt-get install -y -qq netavark aardvark-dns conmon uidmap \
            libgpgme-dev libseccomp-dev libbtrfs-dev libassuan-dev libdevmapper-dev libsystemd-dev pkg-config go-md2man
          # Ubuntu's crun 1.14 rejects the OCI spec version podman 5 emits ("unknown version specified").
          crun_v=$(sed -nE 's/^crun: *"([^"]+)"/\1/p' versions.yaml)
          sudo curl -fsSL -o /usr/local/bin/crun "https://github.com/containers/crun/releases/download/${crun_v}/crun-${crun_v}-linux-amd64"
          sudo chmod 755 /usr/local/bin/crun; crun --version | head -1
          podman_v=$(sed -nE 's/^podman: *"([^"]+)"/\1/p' versions.yaml)
          git clone --quiet --depth 1 --branch "v${podman_v}" https://github.com/containers/podman.git /tmp/podman
          make -C /tmp/podman -j"$(nproc)" BUILDTAGS="seccomp systemd" binaries
          sudo make -C /tmp/podman install.bin install.systemd
          sudo ln -sfn /usr/local/lib/systemd/system-generators/podman-system-generator /etc/systemd/system-generators/podman-system-generator || true
          podman --version
          sudo swapoff -a
          sudo -n true
          free -g; nproc; uname -r
      - name: Install tk8s with install.sh from this checkout
        run: TK_VERSION="${GITHUB_REF_NAME}" TK_REPO="$GITHUB_WORKSPACE" TK_RAW="file://$GITHUB_WORKSPACE" sh install.sh
      - name: Build the node image from this checkout
        run: |
          k8s="${{ matrix.k8s }}"; crio=$(sed -nE "s/^  \"${k8s%.*}\": *\"([^\"]+)\".*/\1/p" versions.yaml)
          [ -n "$crio" ] || { echo "versions.yaml has no crio entry for Kubernetes minor ${k8s%.*}"; exit 1; }
          sudo podman build --build-arg VER="$k8s" --build-arg CRIO="$crio" --force-rm -t "ghcr.io/tarokolabs/tk8s/node:v$k8s" images/node >/tmp/node-build.log 2>&1 || { tail -30 /tmp/node-build.log; exit 1; }
      - name: Build the node image of the previous Kubernetes (mesh)
        if: matrix.mesh
        run: |
          prev=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml); crio=$(sed -nE "s/^  \"${prev%.*}\": *\"([^\"]+)\".*/\1/p" versions.yaml)
          [ -n "$prev" ] && [ -n "$crio" ] || { echo "versions.yaml has no previous Kubernetes or its crio entry"; exit 1; }
          sudo podman build --build-arg VER="$prev" --build-arg CRIO="$crio" --force-rm -t "ghcr.io/tarokolabs/tk8s/node:v$prev" images/node >/tmp/node-prev-build.log 2>&1 || { tail -30 /tmp/node-prev-build.log; exit 1; }
      - name: Build the router image from this checkout
        run: |
          vyos=$(sed -nE 's/^vyos: *"([^"]+)".*/\1/p' versions.yaml); sha=$(sed -nE 's/^vyos_sha256: *"([^"]+)".*/\1/p' versions.yaml)
          [ -n "$vyos" ] && [ -n "$sha" ] || { echo "versions.yaml has no vyos/vyos_sha256"; exit 1; }
          sudo podman build --build-arg VYOS="$vyos" --build-arg SHA256="$sha" --force-rm -t "ghcr.io/tarokolabs/tk8s/router:$vyos" images/router >/tmp/router-build.log 2>&1 || { tail -30 /tmp/router-build.log; exit 1; }
      - name: Fill the shared image store (a second run must find it full)
        run: |
          set -eux
          tkctl pull images --k8s "${{ matrix.k8s }}"
          tkctl pull images --k8s "${{ matrix.k8s }}" | tee /tmp/pull2.txt
          grep -q "nothing to pull" /tmp/pull2.txt
          tkctl get images --k8s "${{ matrix.k8s }}"
          # Everything else a create fetches on the host: the CNI plugins (cilium's CLI came with pull images).
          tkctl create cluster ci --workers 1 --k8s "${{ matrix.k8s }}" --phase nodes/cni-plugins
      - name: Fill the store for the previous Kubernetes too (mesh)
        if: matrix.mesh
        run: |
          prev=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml)
          tkctl pull images --k8s "$prev"
      - name: Block every host tkctl downloads from
        run: |
          # The runner must keep talking to GitHub, so this is a hosts-file block rather than an egress
          # firewall; node-side pulls are counted from the CRI-O journal after verify.
          printf '0.0.0.0 %s # tk8s-offline\n' quay.io registry.k8s.io docker.io registry-1.docker.io ghcr.io raw.githubusercontent.com objects.githubusercontent.com dl.k8s.io storage.googleapis.com helm.cilium.io | sudo tee -a /etc/hosts
      - name: Create a cluster (offline)
        env:
          DATAPATH: ${{ inputs.datapath || 'auto' }}
          TK_OFFLINE: "1"
        run: time tkctl create cluster ci --workers 1 --k8s "${{ matrix.k8s }}" --datapath "$DATAPATH" --ha "${{ matrix.ha }}" --routers "${{ matrix.routers || 1 }}"
      - name: Verify
        run: tkctl verify cluster ci
      - name: Mesh with a second cluster on the previous Kubernetes
        if: matrix.mesh
        env:
          TK_OFFLINE: "1"
        run: |
          set -eux
          prev=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml)
          # The runner's Docker sets FORWARD to DROP: traffic between the two clusters' bridges needs a way through.
          sudo iptables -I DOCKER-USER -j ACCEPT
          time tkctl create cluster ci2 --workers 1 --memory 2G --k8s "$prev" --ha proxy
          tkctl connect cluster ci ci2 | tee /tmp/connect.txt
          grep -q "clusters ci, ci2 connected" /tmp/connect.txt
          tkctl get clusters | tee /tmp/get.txt
          grep -E "^ci +.* ci2 +172" /tmp/get.txt
          export KUBECONFIG=/opt/taroko/clusters/ci/kubeconfig
          [ "$(kubectl -n kube-system get svc clustermesh-apiserver -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" = 172.22.0.200 ]
          agnhost=$(sed -nE 's/^verify_agnhost: *"([^"]+)"/\1/p' versions.yaml)
          busybox=$(sed -nE 's/^verify_busybox: *"([^"]+)"/\1/p' versions.yaml)
          for c in ci ci2; do
            KUBECONFIG=/opt/taroko/clusters/$c/kubeconfig kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: echo
            annotations:
              service.cilium.io/global: "true"
          spec:
            selector:
              app: echo
            ports:
              - port: 80
                targetPort: 8080
          EOF
          done
          # the Deployment lives in ci2 only: every answer ci gets comes from the other cluster
          KUBECONFIG=/opt/taroko/clusters/ci2/kubeconfig kubectl create deploy echo --image="$agnhost" -- /agnhost netexec --http-port=8080
          KUBECONFIG=/opt/taroko/clusters/ci2/kubeconfig kubectl rollout status deploy/echo --timeout=180s
          for i in $(seq 1 12); do
            out=$(kubectl run probe-$i --image="$busybox" --restart=Never --rm -i --attach --quiet --command -- wget -qO- -T 5 http://echo.default/hostname 2>/dev/null || true)
            case "$out" in echo-*) break ;; esac; sleep 5
          done
          echo "answer: $out"; case "$out" in echo-*) ;; *) echo "no answer from the global service across the mesh"; exit 1 ;; esac
          tkctl describe cluster ci | tee /tmp/describe.txt
          grep -E "default/echo +local 0 +remote 1" /tmp/describe.txt
          tkctl verify cluster ci --phase mesh
          tkctl disconnect cluster ci ci2 | tee /tmp/disconnect.txt
          grep -q "clusters ci and ci2 disconnected" /tmp/disconnect.txt
          # ci2 stays up for the pull check and the logs; the last step deletes it
      - name: One router down (routers 2)
        if: matrix.routers == 2
        run: |
          set -eux
          vip=$(sed -nE 's/^ *vip: *//p' /opt/taroko/clusters/ci/cluster.yaml)
          sudo systemctl stop ci-router-1.service; sleep 5
          [ "$(curl -sk --max-time 5 "https://$vip:6443/readyz")" = ok ]
          ! tkctl verify cluster ci --phase router | tee /tmp/verify-down.txt
          grep -q "FAIL  router VRRP" /tmp/verify-down.txt
          tkctl add node ci --role worker | tee /tmp/add.txt
          grep -q "ci-router-1 is not running" /tmp/add.txt
          sudo systemctl start ci-router-1.service
          for i in $(seq 1 12); do tkctl verify cluster ci --phase router && break; sleep 5; done
          tkctl verify cluster ci
      - name: No node pulled an image
        run: |
          rc=0
          for n in ci-control-plane-1 ci-worker-1 $([ -n "${{ matrix.mesh }}" ] && echo ci2-control-plane-1 ci2-worker-1); do
            c=$(sudo podman exec "$n" journalctl -u crio --no-pager | grep -c 'Pulled image' || true)
            echo "$n: $c pulled"; [ "$c" -eq 0 ] || { sudo podman exec "$n" journalctl -u crio --no-pager | grep 'Pulled image'; rc=1; }
          done
          exit $rc
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          sudo journalctl -u ci.target -u ci-control-plane-1.service -u ci-worker-1.service --no-pager > logs/units.log 2>&1 || true
          sudo podman ps -a > logs/podman-ps.txt 2>&1 || true
          for r in $(sudo podman ps -a --format '{{.Names}}' | grep '^ci-router'); do
            sudo podman logs "$r" > "logs/$r.log" 2>&1 || true
            sudo podman exec "$r" vtysh -c 'show bgp summary' -c 'show ip route' -c 'show bfd peers' > "logs/$r-frr.txt" 2>&1 || true
            sudo podman exec "$r" /opt/vyatta/bin/vyatta-op-cmd-wrapper show vrrp > "logs/$r-vrrp.txt" 2>&1 || true
          done
          for n in ci-control-plane-1 ci-worker-1 $([ -n "${{ matrix.mesh }}" ] && echo ci2-control-plane-1 ci2-worker-1); do
            sudo podman logs "$n" > "logs/$n.log" 2>&1 || true
            sudo podman exec "$n" journalctl -u kubelet -u crio --no-pager > "logs/$n-node.log" 2>&1 || true
            sudo podman exec "$n" journalctl -u crio --no-pager | grep -E 'Pull|pull' > "logs/$n-pulls.log" 2>&1 || true
          done
          for d in /opt/taroko/clusters/*/logs; do n=$(basename "$(dirname "$d")"); for f in "$d"/*.out; do [ -f "$f" ] && cp "$f" "logs/$n-$(basename "$f")"; done; done 2>/dev/null || true
          export KUBECONFIG=/opt/taroko/clusters/ci/kubeconfig
          kubectl get pods -A -o wide > logs/pods.txt 2>&1 || true
          # pod-level reachability of the API ClusterIP from each node, cilium service map, host firewall
          probe_img=$(sed -nE 's/^verify_alpine: *"([^"]+)"/\1/p' versions.yaml)
          for n in ci-control-plane-1 ci-worker-1; do
            kubectl run "probe-$n" --image="$probe_img" --restart=Never --overrides="{\"spec\":{\"nodeName\":\"$n\"}}" -- sh -c 'wget -qO- -T 5 --no-check-certificate https://10.98.0.1/version 2>&1 | head -c 200; echo; wget -qO- -T 5 --no-check-certificate https://172.22.0.1:6443/version 2>&1 | head -c 200' >/dev/null 2>&1 || true
          done; sleep 20
          for n in ci-control-plane-1 ci-worker-1; do { echo "== probe on $n (ClusterIP then node IP)"; kubectl logs "probe-$n" 2>&1; } >> logs/probes.txt; done
          c=$(kubectl -n kube-system get pods -l k8s-app=cilium -o jsonpath='{.items[0].metadata.name}'); kubectl -n kube-system exec "$c" -- cilium-dbg service list > logs/cilium-services.txt 2>&1 || true
          kubectl -n kube-system exec "$c" -- cilium-dbg status --verbose > logs/cilium-verbose.txt 2>&1 || true
          sudo nft list ruleset > logs/nft.txt 2>&1 || true; sudo iptables -S 2>/dev/null > logs/iptables.txt || true
          sudo podman exec ci-worker-1 sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter net.bridge.bridge-nf-call-iptables > logs/worker-sysctl.txt 2>&1 || true
          sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter net.bridge.bridge-nf-call-iptables > logs/host-sysctl.txt 2>&1 || true
          # describe and logs of every pod that is not Running/Completed
          kubectl get pods -A --no-headers 2>/dev/null | awk '$4!="Running" && $4!="Completed"{print $1, $2}' | while read -r ns pod; do
            { kubectl -n "$ns" describe pod "$pod"; echo "--- logs"; kubectl -n "$ns" logs "$pod" --all-containers --tail=400; echo "--- previous"; kubectl -n "$ns" logs "$pod" --all-containers --previous --tail=400; } > "logs/pod-$ns-$pod.txt" 2>&1 || true
          done
      - name: Restore /etc/hosts
        if: always()
        run: sudo sed -i '/# tk8s-offline$/d' /etc/hosts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-${{ github.run_id }}-${{ matrix.k8s }}-${{ matrix.ha }}-r${{ matrix.routers || 1 }}${{ matrix.mesh && '-mesh' || '' }}
          path: logs/
      - name: Delete the cluster
        if: always()
        run: |
          tkctl delete cluster ci --yes || true
          [ -z "${{ matrix.mesh }}" ] || tkctl delete cluster ci2 --yes || true
