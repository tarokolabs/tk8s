# Release (#13): pushing a v* tag builds the node image for both supported Kubernetes versions,
# waits for the L3 run of the same commit, and creates the GitHub Release with notes rendered
# from versions.yaml and the image digests (the digest table is the compatibility contract).
# First-time setup: the GHCR package tk8s/node must grant this repo write access under
# "Manage Actions access" for GITHUB_TOKEN to push.
name: release
permissions:
  contents: read
on:
  push:
    tags: ["v*"]
jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      k8s: ${{ steps.v.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          d=$(sed -nE 's/^  default: *"([^"]+)"/\1/p' versions.yaml); p=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml)
          echo "k8s=[\"$d\",\"$p\"]" >> "$GITHUB_OUTPUT"
  node:
    needs: versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        k8s: ${{ fromJSON(needs.versions.outputs.k8s) }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push the node image
        run: TK="$GITHUB_WORKSPACE" SUDO="" DIGEST_DIR="$GITHUB_WORKSPACE/digests" scripts/build-images.sh node "${{ matrix.k8s }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-node-${{ matrix.k8s }}
          path: digests/
  release:
    needs: [node]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - name: Wait for L3 on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            st=$(gh run list -R "$GITHUB_REPOSITORY" --workflow l3.yaml --commit "$GITHUB_SHA" --json status,conclusion -q '.[0] | .status + "/" + (.conclusion // "")')
            case "$st" in completed/success) echo "L3 green"; exit 0 ;; completed/*) echo "L3 $st"; exit 1 ;; esac
            sleep 30
          done
          echo "L3 did not finish"; exit 1
      - name: Render release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" digests > /tmp/notes.md && cat /tmp/notes.md
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "tk8s $GITHUB_REF_NAME" --notes-file /tmp/notes.md
