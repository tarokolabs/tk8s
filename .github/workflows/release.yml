# Release (#13): pushing a v* tag builds the node image for both supported Kubernetes versions,
# waits for the e2e run of the same commit, and creates the GitHub Release with notes rendered
# from versions.yaml and the image digests (the digest table is the compatibility contract).
# First-time setup: the GHCR package tk8s/node must grant this repo write access under
# "Manage Actions access" for GITHUB_TOKEN to push.
name: release
permissions:
  contents: read
on:
  push:
    tags: ["v*"]
jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      k8s: ${{ steps.v.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          d=$(sed -nE 's/^  default: *"([^"]+)"/\1/p' versions.yaml); p=$(sed -nE 's/^  previous: *"([^"]+)"/\1/p' versions.yaml)
          echo "k8s=[\"$d\",\"$p\"]" >> "$GITHUB_OUTPUT"
  node:
    needs: versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        k8s: ${{ fromJSON(needs.versions.outputs.k8s) }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push the node image
        run: TK="$GITHUB_WORKSPACE" SUDO="" DIGEST_DIR="$GITHUB_WORKSPACE/digests" scripts/build-images.sh node "${{ matrix.k8s }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-node-${{ matrix.k8s }}
          path: digests/
  release:
    needs: [node]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - name: Wait for e2e on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Green as soon as any e2e run for the commit succeeded; red once every run is complete without
        # a success (a tag push and a main push each get a run, and the concurrency group may cancel one).
        run: |
          for _ in $(seq 1 90); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yaml --commit "$GITHUB_SHA" --json status,conclusion)
            if echo "$runs" | grep -q '"conclusion":"success"'; then echo "e2e green for $GITHUB_SHA"; exit 0; fi
            if [ "$runs" != "[]" ] && ! echo "$runs" | grep -qE '"status":"(queued|in_progress|waiting|requested|pending)"'; then
              echo "e2e red for $GITHUB_SHA: $(echo "$runs" | grep -oE '"conclusion":"[a-z_]+"' | cut -d'"' -f4 | paste -sd, -)" >&2; exit 1
            fi
            sleep 30
          done
          echo "e2e did not finish for $GITHUB_SHA within 45 min" >&2; exit 1
      - name: Render release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" digests > /tmp/notes.md && cat /tmp/notes.md
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "tk8s $GITHUB_REF_NAME" --notes-file /tmp/notes.md
