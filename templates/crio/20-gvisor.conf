# CRI-O runtime handler for gVisor; written into the node by addons:gvisor when the cluster was created with --gvisor.
# CRI-O 1.37 起支援 containerd-shim-runsc-v1（cri-o/cri-o#9974）：runtime_type 必須是 "vm"，
# CRI-O 才會走 shim 路徑建 pause container，這是 gVisor 沙箱初始化的必要條件。
# 已知雜訊：crio 啟動時對 runsc 抓版本會印 exit status 2、pod 生命週期會有
# "forward event: dial unix: missing address"（shim 想推事件給 containerd）——皆無功能影響。
[crio.runtime.runtimes.runsc]
runtime_path = "/usr/local/bin/containerd-shim-runsc-v1"
runtime_type = "vm"
runtime_root = "/run/gvisor"
