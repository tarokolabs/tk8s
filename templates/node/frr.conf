! Generated by tkctl for $node of cluster $cluster: announce the apiserver VIP $vip to the router(s)
! while it is on lo (tk8s-apiserver-health keeps it there exactly while /readyz answers ok).
frr defaults traditional
hostname $node
!
router bgp 65001
 bgp router-id $node_ip
$neighbors
 address-family ipv4 unicast
  redistribute connected route-map vip-only
$neighbor_policies
 exit-address-family
exit
!
ip prefix-list vip seq 10 permit $vip/32
!
route-map vip-only permit 10
 match ip address prefix-list vip
exit
!
bfd
$bfd_peers
exit
!
end
