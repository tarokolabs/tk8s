! Generated by tkctl for $node of cluster $cluster: announce the apiserver VIP $vip to the router
! while it is on lo (tk8s-apiserver-health keeps it there exactly while /readyz answers ok).
frr defaults traditional
hostname $node
!
router bgp 65001
 bgp router-id $node_ip
 neighbor $router_ip remote-as 65000
 neighbor $router_ip bfd
 neighbor $router_ip timers 3 9
 address-family ipv4 unicast
  redistribute connected route-map vip-only
  neighbor $router_ip route-map vip-only out
 exit-address-family
exit
!
ip prefix-list vip seq 10 permit $vip/32
!
route-map vip-only permit 10
 match ip address prefix-list vip
exit
!
bfd
 peer $router_ip
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
end
