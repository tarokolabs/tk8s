# 節點內 CRI-O 的 storage 設定。
# additionalimagestores 指向 /var/lib/containers/shared：tkctl 把主機的共用 image store
# （/opt/taroko/images/<K8s 版本>）以唯讀掛在這裡；沒掛時該目錄為空，CRI-O 照常運作（優雅退化）。
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = [
  "/var/lib/containers/shared",
]

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
