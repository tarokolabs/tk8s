# 節點內 CRI-O 的 storage 設定。
# additionalimagestores 指向 /var/lib/shared——kcn 若偵測到主機的共用
# image store（/opt/zfs/images/base）會以唯讀掛進來；沒掛時該目錄為空，
# CRI-O 照常運作（優雅退化）。
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = [
  "/var/lib/shared",
]

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
