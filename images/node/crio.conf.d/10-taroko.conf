# Taroko 平台的 CRI-O 設定。套件自帶 10-crio.conf，本檔字典序在其後
# （crio < taroko），同名鍵以本檔為準。
[crio.runtime]
# kubeadm 自 1.22 起預設 cgroupDriver=systemd，kubelet 與 CRI 必須一致
cgroup_manager = "systemd"
conmon_cgroup = "pod"
# crun 與 runc 都由 cri-o 套件提供（/usr/libexec/crio/）
default_runtime = "crun"
# 節點 container 內沒有 SELinux policy
selinux = false

[crio.network]
network_dir = "/etc/cni/net.d"
# kcn 把主機的 ~/cni 掛到節點的 /opt/cni/bin，故排在前面
plugin_dirs = [
    "/opt/cni/bin",
    "/usr/libexec/cni",
]

[crio.image]
# 平台內建的私有 registry（dkreg）走 HTTP
insecure_registries = [
    "dkreg.taroko:5000",
]
