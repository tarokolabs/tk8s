apiVersion: v1
kind: Secret
metadata:
  namespace: kube-system # Notice
  name: kadm-secret
type: Opaque
stringData:
  name: "data"
  metaurl: "redis://redis.s3-system.svc.k1.org/3" # Notice
  storage: "minio"
  bucket: "http://miniosnsd.s3-system.svc.k1.org:9000/kadm" # Notice
  access-key: "minio"
  secret-key: "minio123"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-kadm
provisioner: csi.juicefs.com
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/node-publish-secret-name: kadm-secret
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system # CSI Driver deploy on which namespace
  csi.storage.k8s.io/provisioner-secret-name: kadm-secret
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system # CSI Driver deploy on which namespace
