kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${STU}-clusterbind
  namespace: ${STU} 
subjects:
- kind: User
  name: ${STU}
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole #this must be Role or ClusterRole
  name: ${STU}-clusterole 
  apiGroup: rbac.authorization.k8s.io
