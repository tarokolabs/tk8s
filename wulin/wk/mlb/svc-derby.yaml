apiVersion: v1
kind: Service
metadata:
  name: svc-derby
  labels:
    app: dep-derby
  annotations:
    metallb.universe.tf/address-pool: mlb-pool
spec:
  ports:
  - port: 80
    targetPort: 8888
  selector:
    app: dep-derby
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false    # 關閉 NodePort
