# 平台安裝的替代 container runtime 對應的 RuntimeClass
# handler 名稱對應 containerd 設定（templates/containerd/containerd-config*.yaml）中註冊的 runtime
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: crun
handler: crun
