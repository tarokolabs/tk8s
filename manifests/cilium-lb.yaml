# cilium 的 L2 對外公告：LoadBalancer IP 由節點在 LAN／bridge 上以 ARP 宣告。
# 兩個 LB-IPAM 池（default-pool 給使用者的 Service、mesh-pool 只給 kube-system/clustermesh-apiserver）
# 由 tkctl 依 cluster.yaml 的 lb_range 與 mesh 產生，接在這份檔案前面一起 apply。
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2
spec:
  loadBalancerIPs: true
  externalIPs: true
